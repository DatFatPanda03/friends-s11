  :root[data-size="s"] { --size: .9375rem; }
  :root[data-size="l"] { --size: 1.1875rem; }

  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 5.5rem; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: var(--size);
    line-height: 1.62;
    margin: 0;
    overflow-wrap: break-word;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* ---- header ---- */
  header {
    position: fixed; inset: 0 0 auto 0; z-index: 40;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--rule);
    padding-top: env(safe-area-inset-top);
  }
  .bar {
    display: flex; align-items: center; gap: .5rem;
    max-width: 40rem; margin: 0 auto; padding: .5rem .75rem;
  }
  .where {
    flex: 1; min-width: 0;
    font-family: var(--sans); font-size: .6875rem; font-weight: 600;
    letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pct { font-family: var(--sans); font-size: .6875rem; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .icon {
    width: 2rem; height: 2rem; flex: none; border-radius: 999px;
    display: grid; place-items: center;
    font-family: var(--sans); font-size: .75rem; font-weight: 700;
    color: var(--muted); border: 1px solid var(--rule); background: var(--raise);
  }
  .icon:hover { color: var(--accent); border-color: var(--accent); }
  .icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

  .rail { height: 3px; background: var(--rule); position: relative; }
  .rail > i { position: absolute; inset: 0 auto 0 0; background: var(--gold); width: 0; transition: width .18s linear; }
  .rail > b { position: absolute; top: -2px; width: 2px; height: 7px; background: var(--accent); opacity: 0; }

  /* ---- scene sheet ---- */
  .sheet {
    position: fixed; z-index: 39; inset: 0 0 0 0;
    background: color-mix(in srgb, var(--ground) 70%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none;
  }
  .sheet[data-open="1"] { display: block; }
  .sheet nav {
    position: absolute; inset: auto 0 0 0; max-height: 72vh; overflow-y: auto;
    background: var(--raise); border-top: 1px solid var(--rule);
    box-shadow: var(--shadow); border-radius: 16px 16px 0 0;
    padding: .75rem .5rem calc(1.25rem + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }
  .sheet nav > div { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1px; }
  .sheet button {
    display: flex; gap: .75rem; align-items: baseline; width: 100%; text-align: left;
    padding: .6rem .75rem; border-radius: 8px; font-family: var(--sans); font-size: .875rem; line-height: 1.35;
  }
  .sheet button:hover { background: var(--accent-soft); }
  .sheet button[data-act="1"] {
    font-size: .6875rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); padding-top: 1rem;
  }
  .sheet button > span:first-child { color: var(--faint); font-variant-numeric: tabular-nums; font-size: .75rem; flex: none; width: 1.75rem; }
  .sheet button[data-read="1"] > span:first-child { color: var(--gold); }

  /* ---- resume pill ---- */
  .resume {
    position: fixed; z-index: 38; left: 50%; transform: translate(-50%, 1.5rem);
    bottom: calc(1rem + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: .5rem;
    padding: .6rem 1rem; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    font-family: var(--sans); font-size: .8125rem; font-weight: 600;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .resume[data-show="1"] { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

  /* ---- display panel ---- */
  .panel { padding: .25rem .5rem; gap: 0 !important; }
  .grouplabel {
    font-family: var(--sans); font-size: .625rem; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--faint);

  .grouplabel:first-child { margin-top: .25rem; }
  .row { display: flex; gap: .5rem; }
  .sheet .panel button {

    border: 1px solid var(--rule); background: var(--raise);
    border-radius: 10px; padding: 0;
  }
  .sheet .panel .row button {
    flex: 1; height: 3rem; font-family: var(--serif); color: var(--muted);
  }
  .sheet .panel button:hover { border-color: var(--accent); }
  .sheet .panel button[aria-pressed="true"] {
    border-color: var(--accent); background: var(--accent-soft); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
  .sheet .panel .swatches button {
    aspect-ratio: 1; background: var(--ground); position: relative; overflow: hidden;
  }
  .swatches button > i {
    width: 42%; aspect-ratio: 1; border-radius: 999px; background: var(--accent);
    box-shadow: 0 0 0 3px var(--raise), 0 0 0 4px var(--rule);
  }
  .swatches button > u {
    position: absolute; inset: auto 0 0 0; height: 26%;
    background: var(--ink); opacity: .82; text-decoration: none;
  }
  .swatches button[data-t="auto"] {
    background: linear-gradient(105deg, #F6F2F4 0 50%, #17121A 50% 100%) !important;
  }
  .swatches button[data-t="auto"] > i { background: #7A3E8F; box-shadow: 0 0 0 3px #FFFFFF; }
  .swatches button[data-t="auto"] > u { display: none; }
  .swname {
    font-family: var(--sans); font-size: .6875rem; color: var(--muted);
    margin: .6rem .25rem 0; min-height: 1em;
  }

  /* ---- script body ---- */
  main {
    max-width: 34rem; margin: 0 auto;
    padding: 5.25rem 1.25rem 60vh;
    padding-left: max(1.25rem, env(safe-area-inset-left));
    padding-right: max(1.25rem, env(safe-area-inset-right));
  }
  .titleblock { margin-bottom: 3rem; text-align: center; }
  .titleblock .show {
    font-family: var(--sans); font-size: .75rem; font-weight: 700;
    letter-spacing: .48em; text-indent: .48em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 1.25rem;
  }
  .titleblock h1 {
    font-family: var(--serif); font-weight: 400; font-size: 1.9rem; line-height: 1.2;
    text-wrap: balance; margin: 0 0 .75rem; font-style: italic;
  }
  .titleblock .ep, .titleblock .note {
    font-family: var(--sans); font-size: .75rem; color: var(--muted); margin: 0;
  }
  .titleblock .ep { letter-spacing: .1em; text-transform: uppercase; margin-bottom: .5rem; }
  .titleblock .note { font-style: italic; margin-top: .75rem; }

  h2.act {
    font-family: var(--sans); font-size: .6875rem; font-weight: 700;
    letter-spacing: .28em; text-indent: .28em; text-transform: uppercase;
    color: var(--accent); text-align: center;
    margin: 3.5rem 0 2rem; padding-top: 1.75rem; border-top: 1px solid var(--rule);
  }
  .scenenum {
    display: flex; align-items: center; gap: .6rem;
    font-family: var(--sans); font-size: .625rem; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; color: var(--faint);
    margin: 2.75rem 0 1.25rem;
  }
  .scenenum::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .scenenum + .stage { margin-top: 0; }
  .stage {
    font-family: var(--mono); font-size: .8125em; line-height: 1.6; font-style: italic;
    color: var(--muted); margin: 1.75rem 0; padding-left: .875rem;
    border-left: 2px solid var(--rule);
  }
  .line { margin: 1.25rem 0; }
  .cue {
    display: block; font-family: var(--mono); font-size: .6875em; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
    margin-bottom: .1rem;
  }
  .line p { margin: 0; }
  .line em, .stage em { font-style: italic; }
  .line em.paren { color: var(--muted); font-family: var(--mono); font-size: .8em; }
  hr { border: 0; height: 1px; background: var(--rule); margin: 2.5rem auto; width: 4rem; }
  .plain { margin: 1.25rem 0; color: var(--muted); font-style: italic; }
  .end {
    font-family: var(--sans); font-size: .6875rem; font-weight: 700; letter-spacing: .28em;
    text-transform: uppercase; text-align: center; color: var(--faint); margin: 3rem 0 0;
  }
  .mark { position: relative; }
  .mark::before {
    content: ""; position: absolute; left: -1.25rem; top: .35em;
    width: 3px; height: 1.2em; border-radius: 2px; background: var(--gold);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto !important; } }

  var md = "# FRIENDS\n## Season 11, Episode 1\n# \"The One After Rachel Got Off the Plane\"\n\n*Picks up the morning after \"The Last One, Part 2.\"*\n\n---\n\n## TEASER\n\n**[Scene: Ross's apartment. Morning. ROSS and RACHEL in bed, both awake, staring at the ceiling, grinning like idiots.]**\n\n**ROSS:** You got off the plane.\n\n**RACHEL:** I got off the plane.\n\n**ROSS:** You got off the plane.\n\n**RACHEL:** Honey. We've been doing this since four in the morning.\n\n**ROSS:** Every time I say it, it's still true. It's like a magic trick that keeps working.\n\n**RACHEL:** *(laughing)* Okay. Can I ask you something?\n\n**ROSS:** Anything.\n\n**RACHEL:** What am I wearing tomorrow?\n\n**ROSS:** *(sincerely)* Personally, I'm a big fan of what you're wearing right now\u2014\n\n**RACHEL:** Ross. Everything I own is on a boat.\n\n**ROSS:** ...What?\n\n**RACHEL:** A boat! To France! I packed my entire life into a shipping container and mailed it to a country I am no longer in.\n\n**ROSS:** So what do you have?\n\n**RACHEL:** My purse, the clothes I flew in, and a duty-free Toblerone.\n\n**ROSS:** *(beat)* Well, that's not nothing. That's a *big* Toblerone.\n\n**RACHEL:** It is currently the largest thing I own. *(beat)* Ross, I don't have a job. I don't have an apartment. I don't have *pants.*\n\n**ROSS:** *(a beat too long. Then, quietly)* You have me.\n\n**[She looks at him. Everything softens.]**\n\n**RACHEL:** ...I have you.\n\n**[Beat.]**\n\n**RACHEL:** Do you have pants?\n\n**ROSS:** I have *so many* pants. I have pants I don't even *like.*\n\n**RACHEL:** Why do you have pants you don't like?\n\n**ROSS:** Because they were on *sale*, Rachel. I am a man who buys pants at *volume.*\n\n**RACHEL:** *(gathering the sheet)* Okay. Show me the pants.\n\n**ROSS:** *(leaping out of bed)* I have waited ten years for you to say that!\n\n**[He bolts out of frame. Beat. An enormous crash.]**\n\n**ROSS:** *(O.S.)* I'm fine! Don't come in!\n\n**[OPENING CREDITS]**\n\n---\n\n## ACT ONE\n\n### SCENE 1\n\n**[Scene: Central Perk. JOEY on the couch eating a muffin with his hands like an animal. PHOEBE beside him with a clipboard, very official.]**\n\n**PHOEBE:** Attendance. Joey.\n\n**JOEY:** Here.\n\n**PHOEBE:** *(a mark)* Ross and Rachel are late. Demerit each.\n\n**JOEY:** Pheebs. What is that?\n\n**PHOEBE:** It's the schedule. Monica's gone. Somebody has to make us do stuff. *(beat)* Joey, do you know why we saw each other every day for ten years? It wasn't love. It was proximity, and a controlling woman.\n\n**JOEY:** That's not true.\n\n**PHOEBE:** Name one time we made a plan.\n\n**JOEY:** *(opens his mouth. Closes it.)* ...I'm listening.\n\n**PHOEBE:** Everybody gets a day. Mondays are you. Tuesdays are Ross \u2014 Ross doesn't know yet, Ross is going to have *opinions.*\n\n**JOEY:** What about Friday?\n\n**PHOEBE:** Friday is me.\n\n**JOEY:** What do we do on Fridays?\n\n**PHOEBE:** *(gestures at the couch, the coffee, the two of them)* This. Exactly this. Fridays are already perfect. Don't touch Fridays.\n\n**JOEY:** *(genuinely moved)* ...I love Fridays.\n\n**PHOEBE:** *(a mark)* Noted. *(beat)* Also, I can't fly anymore.\n\n**JOEY:** What?\n\n**PHOEBE:** I brought down a commercial aircraft using nothing but the power of my *voice.*\n\n**JOEY:** You told *Rachel.* On the *phone.* From the *cab.*\n\n**PHOEBE:** And who told Rachel, Joey?\n\n**JOEY:** ...You did.\n\n**PHOEBE:** *(satisfied)* I was the *architect.*\n\n**JOEY:** So you're on a list for something Rachel said out loud?\n\n**PHOEBE:** *(igniting)* Yes! Rachel said it to a hundred and forty *strangers* and Rachel can fly *anywhere.* I made one call from a *parked car* and now I can't go to Cleveland.\n\n**JOEY:** Why do you wanna go to Cleveland?\n\n**PHOEBE:** I don't. *(beat)* But I want it to be *available* to me.\n\n**[The door opens. ROSS and RACHEL enter holding hands, radiating. RACHEL wears a men's button-down four sizes too big \u2014 and a pair of ROSS's pants. P I'm on the phone with a woman named Bev at a knitwear company in Long Island City. In *your pants.*\n\n**ROSS:** *(carefully)* But you're happy.\n\n**[RACHEL stops.]**\n\n**RACHEL:** *(honestly)* I'm so happy it's making me nauseous.\n\n**ROSS:** *(triumphant)* See!\n\n**RACHEL:** Ross, both things are true at once! That's what being an adult *is.* Two true things sitting on top of each other making you insane.\n\n**[EMMA looks up.]**\n\n**EMMA:** Pants!\n\n**[Both parents freeze.]**\n\n**RACHEL:** ...What did she say?\n\n**ROSS:** *(delighted, horrified)* She said \"pants.\"\n\n**EMMA:** *(clearly, proudly)* PANTS.\n\n**RACHEL:** *(gesturing at herself)* Well. She's not *wrong.*\n\n**ROSS:** *(scooping her up)* That's a great word! That's a *noun*, Rach, that's a *concrete noun*, developmentally that's\u2014\n\n**RACHEL:** *ROSS.*\n\n**ROSS:** *(beat)* ...Yeah?\n\n**[He sets EMMA down. Something changes in him.]**\n\n**ROSS:** I have to tell you something and I need you to let me finish.\n\n**RACHEL:** *(stopping dead)* That's never good.\n\n**ROSS:** I called Mark.\n\n**RACHEL:** ...Mark?\n\n**ROSS:** Mark Robinson. Mark. Your Mark. *The* Mark.\n\n**RACHEL:** *You called Mark?!* Ross, you *hate* Mark. You once described Mark as, and I'm quoting, \"a man-shaped reason we broke up.\"\n\n**ROSS:** *(a flicker of pride)* I did say that. That's very good. I'd forgotten I said that.\n\n**RACHEL:** *Why did you call Mark?*\n\n**ROSS:** Six this morning. He was gracious about it. He's married. He has a boat. He has a *boat*, Rachel, and he mentioned it *twice*, so.\n\n**RACHEL:** *Ross.*\n\n**ROSS:** *(the hard part)* Louis Vuitton hasn't filled the job.\n\n**[Dead silence.]**\n\n**RACHEL:** ...What?\n\n**ROSS:** You can't fill a position like that in a week. They wanted *you.* Mark talked to Nicole in Paris last night. They'll hold it until Thursday morning.\n\n**[RACHEL sets down the legal pad very slowly, like it might go off.]**\n\n**RACHEL:** *(barely audible)* You got me my job back.\n\n**ROSS:** Yeah.\n\n**RACHEL:** *(the volume arriving all at once)* **Why would you DO that?!**\n\n**ROSS:** Because in five years you're going to be standing in a kitchen somewhere thinking \"I could've had Paris.\" *(beat)* And I'd be the reason.\n\n**RACHEL:** Ross\u2014\n\n**ROSS:** I've *been* the reason before. I have a very bad record with it. *(quieter)* You got off that plane and it's the best thing that ever happened to me. It's going on my *tombstone.* And I've spent every hour since wondering what it cost you.\n\n**[Long pause.]**\n\n**RACHEL:** *(shaking)* I hate you so much right now.\n\n**ROSS:** I know.\n\n**RACHEL:** I *had* it! It was *done!* It was the end of the story and you *gave it back to me!*\n\n**ROSS:** Yes.\n\n**RACHEL:** Now I have to *decide!*\n\n**ROSS:** *(nodding)* Yes.\n\n**[She grabs her coat. Stops at the door. Turns around.]**\n\n**RACHEL:** This is the nicest thing anyone has ever done for me and I have never in my life wanted to hit you more.\n\n**[She goes. The door slams.]**\n\n**[COMMERCIAL BREAK]**\n\n---\n\n## ACT TWO\n\n### SCENE 3\n\n**[Scene: Apartment 20. Night. Pitch black. The door opens and light spills in \u2014 ROSS with a bag. JOEY is asleep on the floor in the middle of the empty room, under his coat, CHICK JR. and DUCK JR. on his chest.]**\n\n**ROSS:** Joey.\n\n**JOEY:** *(bolting upright)* I'm up! *(squinting)* Hey.\n\n**ROSS:** Why are you asleep on the floor of an empty apartment?\n\n**JOEY:** I'm not *asleep.* I *fell* asleep. Totally different.\n\n**ROSS:** You have a bed. It's eleven feet that way.\n\n**JOEY:** Yeah.\n\n**ROSS:** You brought the birds?\n\n**JOEY:** They like it in here. *(beat)* They remember.\n\n**ROSS:** They're *birds*, Joey.\n\n**JOEY:** *(firmly)* They *remember*, Ross.\n\n**[ROSS sits down on the floor beside him. Pulls out two beers.]**\n\n**ROSS:** Talk.\n\n**JOEY:** For ten years I could just... walk in. Any time. Middle of the night. There was *always* somebody in here. *(beat)* Now I gotta call people. I gotta make *plans.* I'm thirty-six years old and I have to make plans.\n\n**ROSS:** *(beat)* You're thirty-six?\n\n**JOEY:** I'm whatever you need me to be.\n\n**ROSS:** *(letting it go)* Joey, I'm across the street. I've been across the street five years.\n\n**JOEY:** Yeah, but the door was *open*, man. Across the street with the door open is nothin'. Across the street with the door *locked* is a *street.*\n\n**[ROSS has nothing. He drinks.]**\n\n**JOEY:** And it's not the apartment. I don't *want* the apartment. It's a *box.* Monica used to yell at me in here. It wasn't even that great. *(beat)* I want one place in this city I can walk into without calling first. That's the whole list.\n\n**ROSS:** How'd you even get a key?\n\n**JOEY:** Treeger. *(off Ross's look)* I told him I'd dance with him at his niece's wedding.\n\n**ROSS:** ...You *what?*\n\n**JOEY:** He's a big guy, he's got nobody, he *asked*, and I got a key out of it. Everybody wins.\n\n**[ROSS looks at him a long moment.]**\n\n**ROSS:** Sometimes you're the smartest person I know.\n\n**JOEY:** *(delighted)* Yeah?\n\n**ROSS:** No.\n\n**JOEY:** *(deflating)* Ah.\n\n**[They drink.]**\n\n**ROSS:** Treeger say what happens to it?\n\n**JOEY:** *(far too quickly)* Nothing happens to it. Why would something happen to it? It's an *apartment*, Ross. Apartments *sit* there, that's the whole\u2014\n\n**ROSS:** Joey.\n\n**JOEY:** *(scrambling up)* I'm gonna go.\n\n**ROSS:** You're doing the face.\n\n**JOEY:** I don't *have* a face!\n\n**ROSS:** You have *one* face, Joey, and right now it is *doing something!*\n\n**JOEY:** *(at the door, agonized)* ROSS. I made a *promise.* To a *man.* In a *suit.*\n\n**ROSS:** *What* man?!\n\n**JOEY:** *(beat)* ...A tall man.\n\n**[He goes. ROSS alone on the floor in the dark with two beers and two birds.]**\n\n**ROSS:** *(calling after him)* THAT'S EVERY MAN, JOEY!\n\n---\n\n### SCENE 4\n\n**[Scene: Central Perk. Wednesday. MONICA and CHANDLER on the couch, a car seat on either side, looking like people who have driven a long way. PHOEBE and JOEY in the chairs. RACHEL pacing, still in the pants. GUNTHER is working \u2014 wiping the counter, collecting cups, drifting in and out of the scene throughout.]**\n\n**CHANDLER:** Fifty-two minutes, nine stops, and a man across from me clipped his fingernails onto the floor of a moving train like *an animal in a fable.*\n\n**PHOEBE:** Why are you here on a Wednesday? Wednesdays are Rachel.\n\n**MONICA:** *(tight)* Because I lost an election, Phoebe.\n\n**JOEY:** You ran for something?\n\n**MONICA:** Block captain. I called a vote.\n\n**RACHEL:** *(stopping)* You've lived there six days.\n\n**CHANDLER:** She went door to door.\n\n**MONICA:** *(defensive)* Twelve houses. Two of them saw me coming.\n\n**PHOEBE:** And?\n\n**MONICA:** Gail got eleven.\n\n**JOEY:** And you got\u2014\n\n**MONICA:** Me.\n\n**CHANDLER:** *(beat)* Who did *I* vote for?\n\n**MONICA:** Gail.\n\n**CHANDLER:** I *what?*\n\n**MONICA:** I filled out yours! I was being *fair!* *(beat)* And it made the margin look better.\n\n**CHANDLER:** It made the margin *eleven to one!*\n\n**[PHOEBE leans over a car seat.]**\n\n**PHOEBE:** Which one's this?\n\n**CHANDLER:** That's Jack.\n\n**PHOEBE:** How do you know?\n\n**CHANDLER:** *(beat)* Systems, Phoebe.\n\n**MONICA:** He labeled them.\n\n**PHOEBE:** *(delighted)* That is *amazing.*\n\n**CHANDLER:** THANK you.\n\n**PHOEBE:** I meant it's amazing that you *let* him.\n\n**MONICA:** *(dark)* I peeled them off. He put them back.\n\n**CHANDLER:** I put them on the *inside* now. It's a *private* system.\n\n**[Laughter. GUNTHER arrives with a coffee pot. JOEY goes rigid.]**\n\n**GUNTHER:** *(refilling, pleasant)* More coffee?\n\n**JOEY:** *(far too loud)* NO.\n\n**[Everyone looks at him. GUNTHER moves on, unbothered.]**\n\n**MONICA:** ...Okay. *(to Rachel)* What's with *you?*\n\n**RACHEL:** Ross got me my job back.\n\n**[Everyone turns.]**\n\n**PHOEBE     goto(saved.i, saved.off || 0);
    setTimeout(function () { goto(saved.i, saved.off || 0); paint(); }, 60);
  }
  paint();
})();
</script>
