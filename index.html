  var md = "# FRIENDS\n## Season 11, Episode 1\n# \"The One After Rachel Got Off the Plane\"\n\n*Picks up the morning after \"The Last One, Part 2.\"*\n\n---\n\n## TEASER\n\n**[Scene: Ross's apartment. Morning. Sunlight through the blinds. ROSS and RACHEL are in bed, both awake, both staring at the ceiling, both grinning like idiots.]**\n\n**ROSS:** You got off the plane.\n\n**RACHEL:** I got off the plane.\n\n**ROSS:** You got off the plane.\n\n**RACHEL:** Honey, we've been doing this since four in the morning.\n\n**ROSS:** I know! I know. It's just \u2014 every time I say it, it's still true. It's like a magic trick that keeps working. *(beat)* You got off the plane!\n\n**RACHEL:** *(laughing)* Okay!\n\n**[She rolls over, propping herself up on an elbow.]**\n\n**RACHEL:** Ross. Can I ask you something?\n\n**ROSS:** Anything. Ask me anything. Ask me a hundred things.\n\n**RACHEL:** What am I wearing tomorrow?\n\n**ROSS:** *(a beat, then sincerely)* I mean, personally, I'm a big fan of what you're wearing right now\u2014\n\n**RACHEL:** Ross. Everything I own is on a boat.\n\n**ROSS:** ...What?\n\n**RACHEL:** A boat! To France! I packed my entire life into a shipping container and mailed it to a country I am no longer in.\n\n**ROSS:** Okay. Okay \u2014 so what do you actually have?\n\n**RACHEL:** I have my purse. I have the clothes I flew in. And I have a duty-free Toblerone.\n\n**ROSS:** *(beat)* Well, that's \u2014 that's not nothing. That's a *big* Toblerone.\n\n**RACHEL:** It's an enormous Toblerone. It is currently the largest thing I own.\n\n**ROSS:** Rach\u2014\n\n**RACHEL:** I don't have a job. I don't have an apartment. I don't have *pants.*\n\n**ROSS:** *(a beat too long. Then, quietly)* You have me.\n\n**[She looks at him. Everything softens.]**\n\n**RACHEL:** ...I have you.\n\n**ROSS:** *(nodding, warm)* You have me.\n\n**[Beat.]**\n\n**RACHEL:** Do you have pants?\n\n**ROSS:** I have *so many* pants. I have pants I don't even *like.*\n\n**RACHEL:** Why do you have pants you don't like?\n\n**ROSS:** Because they were on *sale*, Rachel. I am a man who buys pants at *volume.*\n\n**RACHEL:** *(sitting up, gathering the sheet)* Okay. Show me the pants.\n\n**ROSS:** *(leaping out of bed, thrilled)* I have waited ten years for you to say that!\n\n**[He bolts out of frame. Beat. An enormous crash.]**\n\n**ROSS:** *(O.S.)* I'm fine! Don't come in!\n\n**[OPENING CREDITS]**\n\n---\n\n## ACT ONE\n\n### SCENE 1\n\n**[Scene: Central Perk. JOEY is on the couch eating a muffin with his hands like an animal. PHOEBE sits beside him with a clipboard, very official.]**\n\n**PHOEBE:** Okay. Attendance. Joey.\n\n**JOEY:** Here.\n\n**PHOEBE:** *(making a mark)* Ross and Rachel are late, which is a demerit each. Mike is in Connecticut, which is an excused absence. And Monica and Chandler are in Westchester, which is *also* basically Connecticut.\n\n**JOEY:** Pheebs. What is that?\n\n**PHOEBE:** It's the schedule, Joey.\n\n**JOEY:** What schedule?\n\n**PHOEBE:** *(as if to a child)* Monica's gone. Somebody has to make us do stuff. *(beat)* Joey, do you know why we saw each other every single day for ten years? It wasn't love. It was proximity, and a controlling woman.\n\n**JOEY:** That's not true.\n\n**PHOEBE:** Name one time we made a plan.\n\n**JOEY:** *(opens his mouth. Closes it.)* ...I'm listening.\n\n**PHOEBE:** *(flipping the clipboard around)* Everyone gets a day. Mondays are Joey. Tuesdays are Ross \u2014 Ross doesn't know yet, Ross is going to have *opinions.* Wednesdays are Rachel. Thursdays are Monica and Chandler, because they have to drive in, and Thursday is a nothing day, so they won't feel bad about wasting it.\n\n**JOEY:** What about Friday?\n\n**PHOEBE:** Friday is me.\n\n**JOEY:** What do we do on Fridays?\n\n**PHOEBE:** *(gestures at the couch, the coffee, the two of them)* This. Exactly this. Fridays are already perfect. Don't touch Fridays.\n\n**[JOEY nods, genuinely moved.]**\n\n**JOEY:** ...I love Fridays.\n\n**PHOEBE:** *(making a mark)* Noted.\n\n**[Beat.]**\n\n**PHOEBE:** Oh \u2014 also, I can't fly anymore.\n\n**JOEY:** What?\n\n**PHOEBE:** On planes. In America.\n\n**JOEY:** Why not?!\n\n**PHOEBE:** Because I brought down a commercial aircraft using nothing but the power of my *voice.*\n\n**JOEY:** You told *Rachel* the phalange thing. On the *phone.* From the *cab.*\n\n**PHOEBE:** And who told Rachel, Joey?\n\n**JOEY:** ...You did.\n\n**PHOEBE:** *(satisfied)* I was the *architect.*\n\n**JOEY:** So they put you on a list for something Rachel said out loud?\n\n**PHOEBE:** *(igniting)* Yes! And Rachel isn't on it! Rachel stood up in a *cabin* and said it to a hundred and forty *strangers*, and Rachel can fly *anywhere.* I made one phone call from a *parked car* and now I can't go to Cleveland.\n\n**JOEY:** Why do you wanna go to Cleveland?\n\n**PHOEBE:** I don't. *(beat)* But I want it to be *available* to me.\n\n**[The door opens. ROSS and RACHEL enter, holding hands, radiating. RACHEL is wearing a men's button-down shirt about four sizes too big, sleeves rolled.]**\n\n**ROSS:** *(announcing to the entire coffee house)* Good morning, everyone!\n\n**JOEY:** Hey!\n\n**PHOEBE:** *(checking her watch, making two marks)* Demerit. Demerit.\n\n**RACHEL:** *(seeing the clipboard)* What is happening.\n\n**PHOEBE:** It's Thursday, Rachel. Thursdays are Monica and Chandler. You're a *guest* today.\n\n**RACHEL:** *(to Ross)* I've been back nine hours.\n\n**[They sit. JOEY squints at RACHEL.]**\n\n**JOEY:** Rach. Whose shirt is that?\n\n**RACHEL:** It's Ross's.\n\n**JOEY:** *(nodding slowly, then)* Why?\n\n**RACHEL:** Because everything I own is currently in the middle of the Atlantic Ocean.\n\n**ROSS:** *(unable to stop himself)* It looks *really* good on you.\n\n**RACHEL:** It's a shirt, Ross.\n\n**ROSS:** It's *my* shirt.\n\n**RACHEL:** I know.\n\n**ROSS:** *(to Joey, quietly, thrilled)* It's my shirt.\n\n**JOEY:** So?! So?! Tell it! Tell the whole thing! I fell asleep during the good part!\n\n**ROSS:** *(leaning in, hands out, cinematic)* Okay. Okay. So. I'm sprinting \u2014 full sprint\u2014\n\n**PHOEBE:** You were in my cab. I was *driving.*\n\n**ROSS:** I sprinted *inside* the cab.\n\n**PHOEBE:** You can't sprint inside a cab, Ross. That's just *sitting.*\n\n**RACHEL:** Also it was an eleven-minute ride. I've seen the meter.\n\n**PHOEBE:** I charged him.\n\n**ROSS:** You *charged* me?!\n\n**PHOEBE:** I have a *business*, Ross.\n\n**JOEY:** Okay, and then?!\n\n**ROSS:** And then I burst through the doors \u2014 and there's a *nun*\u2014\n\n**RACHEL:** There's no nun.\n\n**ROSS:** There's *always* a nun in an airport, Rachel, it's an *airport.*\n\n**RACHEL:** Ross, I was *there.*\n\n**ROSS:** You were at the *gate!* You didn't see the *concourse!* There is a whole *world* happening on the concourse!\n\n**JOEY:** What gate?\n\n**ROSS:** Gate fourteen.\n\n**RACHEL:** Gate forty.\n\n**ROSS:** *(gravely)* It *felt* like fourteen.\n\n**[GUNTHER approaches. He stops dead when he sees RACHEL. He does not blink.]**\n\n**GUNTHER:** You're back.\n\n**RACHEL:** *(bright)* I am!\n\n**GUNTHER:** You're not in Paris.\n\n**RACHEL:** Nope!\n\n**GUNTHER:** You're going to be *here.* Every day. Forever.\n\n**RACHEL:** *(charmed)* Isn't that nice?\n\n**[Long pause.]**\n\n**GUNTHER:** I told everyone.\n\n**RACHEL:** ...What?\n\n**GUNTHER:** I told you I loved you. And you said you loved me too.\n\n**RACHEL:** I said \"probably not in the same way\"\u2014\n\n**GUNTHER:** You said the *words*, Rachel. *(beat)* And then you got on a plane and left the country, and I thought \u2014 well. That's the end of that story. That's a very sad, very beautiful, *finished* story. So I told everyone. I told the regulars. I told my mother. I told the man who delivers the milk.\n\n**RACHEL:** Gunther\u2014\n\n**GUNTHER:** I bought a suit.\n\n**RACHEL:** You bought a\u2014\n\n**GUNTHER:** It's a *good* suit, Rachel.\n\n**RACHEL:** Gunther, I'm so\u2014\n\n**GUNTHER:** *(holding NDLER:** I labeled their *clothes.* *(beat)* Which they are wearing. *(beat)* Which is on them.\n\n**MONICA:** Take them off!\n\n**CHANDLER:** And then what?! Then I'm just a man in a house holding two *mysteries!*\n\n**[The doorbell rings. MONICA's head snaps up like a hunting dog.]**\n\n**MONICA:** Someone's here.\n\n**CHANDLER:** Someone's here.\n\n**MONICA:** Someone came *over.*\n\n**CHANDLER:** Honey, breathe\u2014\n\n**MONICA:** *(already running)* SOMEBODY CAME OVER!\n\n**[She flings open the door. GAIL, a pleasant woman in her forties, stands there with a small welcome basket.]**\n\n**GAIL:** Hi! Gail Bergen, number nine. We just wanted to say welcome to Ashby Lane!\n\n**MONICA:** *(a full second of stunned joy)* Oh my God. *(turning, screaming)* CHANDLER! *(turning back)* Wait right there. Wait right there. Do not move.\n\n**[She sprints off. CHANDLER wanders in with the twins.]**\n\n**CHANDLER:** Hi. Chandler. I live here now, apparently.\n\n**GAIL:** Gail. *(peering at the babies)* Oh, they're *beautiful.* Boy or girl?\n\n**CHANDLER:** *(a beat \u2014 he glances down at the labels)* ...One each.\n\n**[MONICA returns, staggering under an enormous basket, roughly the size of a toddler.]**\n\n**MONICA:** Welcome to the neighborhood!\n\n**GAIL:** *(confused)* ...I live here.\n\n**MONICA:** I know! I made fourteen. One for every house on the street. Yours has the good jam, because you're closest.\n\n**GAIL:** *(taking it, a little frightened)* That is *so* thoughtful.\n\n**MONICA:** Also! I noticed the neighborhood association has an opening for block captain\u2014\n\n**CHANDLER:** Honey.\n\n**MONICA:** \u2014and I've prepared some thoughts\u2014\n\n**CHANDLER:** Honey.\n\n**MONICA:** *(whipping around, murderous)* **WHAT.**\n\n**CHANDLER:** *(gently)* It's ten in the morning. On our first day.\n\n**[MONICA takes a breath. Turns back to GAIL. Radiant.]**\n\n**MONICA:** I've prepared some thoughts.\n\n**GAIL:** *(pleasantly)* Oh \u2014 I'm block captain.\n\n**[Dead silence. MONICA's smile does not move.]**\n\n**MONICA:** ...I'm sorry?\n\n**GAIL:** Eleven years! *(cheerfully)* Nobody's ever run against me.\n\n**[Beat. MONICA's head tilts, very slightly, like a bird sighting something.]**\n\n**MONICA:** *(warmly)* ...Nobody's ever *run.*\n\n**CHANDLER:** *(to the babies)* And there it is.\n\n---\n\n### SCENE 3\n\n**[Scene: The hallway outside apartments 19 and 20. JOEY comes out of his door with a sandwich. He stops. He looks at the purple door. He tries the handle. Locked.]**\n\n**[He glances both ways down the hall. Then he pulls a key out of his pocket and lets himself in.]**\n\n**[Scene: Apartment 20. Completely empty. Bare floors. The frame is still on the door. It's enormous and it's nothing.]**\n\n**[JOEY stands in the middle of it, holding his sandwich.]**\n\n**JOEY:** *(to the room)* Hey.\n\n**[He walks a slow circle. Stops where the couch used to be. Sits down on the floor. Takes a bite.]**\n\n**[The door opens. MR. TREEGER, with a clipboard and a tape measure.]**\n\n**TREEGER:** Joey?\n\n**JOEY:** *(not moving, mouth full)* Hey, Mr. Treeger.\n\n**TREEGER:** How'd you get in here?\n\n**JOEY:** *(beat)* ...The door was open.\n\n**TREEGER:** The door was locked.\n\n**JOEY:** *(beat)* Then I don't know what to tell ya.\n\n**[TREEGER crosses the room and picks up a pillow from the corner.]**\n\n**TREEGER:** Joey. There's a pillow.\n\n**JOEY:** That's not mine.\n\n**TREEGER:** It's got your name on it.\n\n**JOEY:** *(beat)* That's a *common* name.\n\n**TREEGER:** It's got your name on it in *tape.*\n\n**JOEY:** *(standing, brushing off)* Okay, you know what, I don't like your tone.\n\n**TREEGER:** *(setting down the clipboard)* You gotta stop coming in here. I rented it.\n\n**JOEY:** *(all the air going out of him)* You *what?*\n\n**TREEGER:** Guy takes it on the first.\n\n**JOEY:** The *first?!* That's eleven days! Mr. Treeger, people wait longer than that to start *dating* after a *funeral!*\n\n**TREEGER:** Joey, it's a rent-controlled two-bedroom in the West Village. I had it rented in four hours. I could've rented it *twice.* I could've rented it to a guy who was *standing in the hallway.*\n\n**JOEY:** I was standing in the hallway!\n\n**TREEGER:** I know! I saw you! You were *crying!*\n\n**JOEY:** I was *not*\u2014\n\n**TREEGER:** You were crying at a *door*, Joey.\n\n**[The door opens. GUNTHER walks in. He is wearing a suit and carrying a folder.]**\n\n**GUNTHER:** Am I early?\n\n**[JOEY stares at him. Then at Treeger. Then back.]**\n\n**JOEY:** ...Gunther?\n\n**GUNTHER:** Joey.\n\n**JOEY:** *(to Treeger)* HIM?! You rented it to *HIM?!*\n\n**TREEGER:** He paid the year up front. In cash. In an envelope. *(beat)* I didn't ask.\n\n**GUNTHER:** *(turning slowly, taking in the empty room, reverent)* Ten years above a coffee house, Joey. You would be *amazed* what a man can save when his entire life is one flight of stairs.\n\n**TREEGER:** *(gathering his clipboard, heading out)* The first. Nine a.m. *(pointing at Joey)* *You.* Not in here.\n\n**[He goes. JOEY and GUNTHER alone in the empty room.]**\n\n**JOEY:** Rachel is gonna *freak out.*\n\n**GUNTHER:** Rachel isn't going to know.\n\n**JOEY:** What?!\n\n**GUNTHER:** You're not going to tell her.\n\n**JOEY:** Why not?!\n\n**GUNTHER:** Because she'll think it's about her.\n\n**JOEY:** *(beat)* ...Is it about her?\n\n**GUNTHER:** *(a long, long pause)* ...It's a two-bedroom, Joey.\n\n**JOEY:** That's not an answer!\n\n**GUNTHER:** *(mildly, moving to the window)* Joey. I have carried a secret for ten years. *(beat)* Do you have any idea how heavy that is?\n\n**JOEY:** No!\n\n**GUNTHER:** *(turning, placing an invisible weight in Joey's hands)* Now you do.\n\n**[He walks out. JOEY stands alone, holding a secret and a sandwich.]**\n\n**JOEY:** *(to the empty room, quietly panicking)* I can't do this. *(beat)* I *cannot* do this.\n\n---\n\n### SCENE 4\n\n**[Scene: Ross's apartment. RACHEL sits at the table with a legal pad and the       return;
    }
    if (b.dataset.s) applySize(b.dataset.s, true);
    else if (b.dataset.t) applyTheme(b.dataset.t, true);
  });

  var sheet = document.getElementById("sheet");
  document.getElementById("menu").addEventListener("click", function () {
    tocEl.querySelectorAll("button").forEach(function (b) {
      b.dataset.read = (+b.dataset.i <= furthest) ? "1" : "0";
    });
    sheet.dataset.open = "1";
    prefsSheet.dataset.open = "0";
    typeBtn.setAttribute("aria-expanded", "false");
  });
  sheet.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    sheet.dataset.open = "0";
    if (b) { goto(+b.dataset.i, 0); commit(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    sheet.dataset.open = "0";
    prefsSheet.dataset.open = "0";
    typeBtn.setAttribute("aria-expanded", "false");
  });

  resume.addEventListener("click", function () {
    goto(openMark, openOff);
    commit();
  });

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", paint);
  document.addEventListener("visibilitychange", function () { if (document.hidden) commit(); });
  window.addEventListener("pagehide", commit);

  /* ---------- open where they left off ---------- */
  if (saved && saved.i > 0) {
    goto(saved.i, saved.off || 0);
    setTimeout(function () { goto(saved.i, saved.off || 0); paint(); }, 60);
  }
  paint();
})();
</script>

</body>
</html>
