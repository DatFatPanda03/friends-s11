  var doc = document.getElementById("doc");
  var md = "# FRIENDS\n## Season 11, Episode 1\n# \"The One After Rachel Got Off the Plane\"\n\n*Transcribed from the episode. Picks up the morning after \"The Last One, Part 2.\"*\n\n---\n\n## TEASER\n\n**[Scene: Ross's apartment. Morning. Sunlight through the blinds. ROSS and RACHEL are in bed, both awake, both staring at the ceiling, both grinning like idiots.]**\n\n**ROSS:** You got off the plane.\n\n**RACHEL:** I got off the plane.\n\n**ROSS:** You got off the plane.\n\n**RACHEL:** Honey, we've been doing this since four in the morning.\n\n**ROSS:** I know! I know. It's just \u2014 every time I say it, it's still true. It's like a magic trick that keeps working. *(beat)* You got off the plane!\n\n**RACHEL:** *(laughing)* Okay!\n\n**[She rolls over, propping herself up on an elbow.]**\n\n**RACHEL:** Ross. Can I ask you something?\n\n**ROSS:** Anything. Ask me anything. Ask me a hundred things.\n\n**RACHEL:** What am I wearing tomorrow?\n\n**ROSS:** *(a beat, then sincerely)* I mean, personally, I'm a big fan of what you're wearing right now\u2014\n\n**RACHEL:** Ross. Everything I own is on a boat.\n\n**ROSS:** ...What?\n\n**RACHEL:** A boat! To France! I packed my entire life into a shipping container and mailed it to a country I am no longer in! *(sitting up)* I have my purse. I have the clothes I flew in. And I have a duty-free Toblerone.\n\n**ROSS:** Okay, well \u2014 that's \u2014 that's not nothing. That's a big Toblerone.\n\n**RACHEL:** Ross, I don't have a job. I don't have an apartment. I don't have *pants.*\n\n**ROSS:** *(a beat too long. Then, quietly)* You have me.\n\n**[She looks at him. Everything softens.]**\n\n**RACHEL:** ...I have you.\n\n**ROSS:** *(nodding, warm)* You have me.\n\n**[Beat.]**\n\n**RACHEL:** Do you have pants?\n\n**ROSS:** I have *so many* pants.\n\n**[OPENING CREDITS]**\n\n---\n\n## ACT ONE\n\n### SCENE 1\n\n**[Scene: Central Perk. JOEY is on the couch eating a muffin with his hands like an animal. PHOEBE sits beside him with a clipboard, very official.]**\n\n**PHOEBE:** Okay. Attendance. Joey.\n\n**JOEY:** Here.\n\n**PHOEBE:** *(making a mark)* Ross and Rachel are late, which is a demerit each. Mike is in Connecticut, which is an excused absence. And Monica and Chandler are in Westchester, which is *also* basically Connecticut.\n\n**JOEY:** Pheebs. What is that?\n\n**PHOEBE:** It's the schedule, Joey.\n\n**JOEY:** What schedule?\n\n**PHOEBE:** *(as if to a child)* Monica's gone. Somebody has to make us do stuff. *(beat)* Joey, do you know why we saw each other every single day for ten years? It wasn't love. It was proximity, and a controlling woman.\n\n**JOEY:** That's not true.\n\n**PHOEBE:** Name one time we made a plan.\n\n**JOEY:** *(opens mouth. Closes it.)* ...I'm listening.\n\n**PHOEBE:** *(flipping the clipboard around)* I've assigned everyone a day. Mondays are Joey. Tuesdays are Ross \u2014 Ross doesn't know yet, Ross is going to have opinions. Wednesdays are Rachel. Thursdays are Monica and Chandler, because they have to drive in, and Thursday is a nothing day, so they won't feel bad about wasting it.\n\n**JOEY:** What about Friday?\n\n**PHOEBE:** Friday is me.\n\n**JOEY:** What do we do on Fridays?\n\n**PHOEBE:** *(gestures at the couch, the coffee, the two of them)* This. Exactly this. Fridays are already perfect. Don't touch Fridays.\n\n**[JOEY nods, genuinely moved.]**\n\n**JOEY:** ...I love Fridays.\n\n**PHOEBE:** *(making a mark)* Noted.\n\n**[Beat.]**\n\n**PHOEBE:** Oh \u2014 also, I can't fly anymore.\n\n**JOEY:** What?\n\n**PHOEBE:** I can't fly. On planes. In America.\n\n**JOEY:** Why not?\n\n**PHOEBE:** Because I told an airplane full of strangers that its left phalange was broken. Apparently that's a *federal* thing? There were two men waiting outside my apartment. They had a folder. With my picture in it. *(proud)* It was a really good picture.\n\n**JOEY:** You're on the no-fly list?!\n\n**PHOEBE:** Joey, I'm on *four* lists. This is just the first one with an airplane on it. *(sipping coffee)* Mike had to call a lawyer. Mike knows lawyers. It is the sexiest thing about him. *(beat)* It is not the sexiest thing about him.\n\n**[The door opens. ROSS and RACHEL enter, holding hands, radiating. RACHEL is wearing a men's button-down shirt about four sizes too big, sleeves rolled.]**\n\n**ROSS:** *(announcing to the entire coffee house)* Good morning, everyone!\n\n**JOEY:** Hey!\n\n**PHOEBE:** *(checking her watch, making a mark)* Demerit. Demerit.\n\n**RACHEL:** *(seeing the clipboard)* What is happening.\n\n**PHOEBE:** It's Thursday, Rachel. Thursdays are Monica and Chandler. You're a *guest* today.\n\n**RACHEL:** *(to Ross)* I've been back nine hours.\n\n**[They sit. JOEY squints at RACHEL.]**\n\n**JOEY:** Rach. Whose shirt is that?\n\n**RACHEL:** It's Ross's.\n\n**JOEY:** *(nodding slowly, then)* Why?\n\n**RACHEL:** Because everything I own is currently in the middle of the Atlantic Ocean.\n\n**ROSS:** *(unable to stop himself)* It looks *really* good on you.\n\n**RACHEL:** It's a shirt, Ross.\n\n**ROSS:** It's *my* shirt.\n\n**RACHEL:** I know.\n\n**ROSS:** *(to Joey, quietly, thrilled)* It's my shirt.\n\n**JOEY:** So?! So?! Tell it! Tell the whole thing! I fell asleep during the good part!\n\n**ROSS:** *(leaning in, hands out, cinematic)* Okay. Okay. So. I'm sprinting \u2014 full sprint \u2014 through Terminal C\u2014\n\n**PHOEBE:** You were in a cab. You called me *from a cab.*\n\n**ROSS:** I sprinted *to* the cab.\n\n**RACHEL:** You *walked* to the cab, Ross. I have the receipt. It's an eleven-minute ride.\n\n**ROSS:** *(to Joey, gravely)* It felt like a sprint.\n\n**JOEY:** Okay, and then?\n\n**ROSS:** And then I burst through the doors \u2014 and there's a *nun*\u2014\n\n**RACHEL:** There's no nun.\n\n**ROSS:** There's *always* a nun in an airport, Rachel, it's an *airport.*\n\n**RACHEL:** Ross, I was *there.*\n\n**ROSS:** You were on the *plane!* You were in seat 32B, you didn't see the *concourse*, Rachel, there's a whole world happening on the concourse!\n\n**[GUNTHER approaches. He stops dead when he sees RACHEL. He does not blink.]**\n\n**GUNTHER:** You're back.\n\n**RACHEL:** *(bright)* I am!\n\n**GUNTHER:** You're not in Paris.\n\n**RACHEL:** Nope!\n\n**GUNTHER:** You're going to be *here.* Every day. Forever.\n\n**RACHEL:** *(charmed)* Isn't that nice?\n\n**[Long pause.]**\n\n**GUNTHER:** I told everyone.\n\n**RACHEL:** ...What?\n\n**GUNTHER:** I told you I loved you. And you said you loved me too. And then you got on a plane, and left the country, and I thought \u2014 well. That's the end of that story. That's a very sad, very beautiful, *finished* story. So I told everyone. *(beat)* I told the regulars. I told my mother. I told the man who delivers the milk. *(beat)* I bought a suit.\n\n**RACHEL:** Gunther\u2014\n\n**GUNTHER:** It's a good suit, Rachel.\n\n**RACHEL:** Gunther, I'm so\u2014\n\n**GUNTHER:** *(holding up a hand, then turning and addressing the entire coffee house, flat)* SHE'S BACK. IT'S FINE. EVERYTHING'S FINE.\n\n**[He walks away. Silence.]**\n\n**PHOEBE:** *(quietly, making a mark on her clipboard)* That was worth the demerit.\n\n---\n\n### SCENE 2\n\n**[Scene: MONICA and CHANDLER's house, Westchester. Big, sunlit, empty. Boxes everywhere \u2014 but arranged in a flawless grid on the living room floor. CHANDLER stands holding both twins, one in each arm. MONICA is on her knees with a label maker.]**\n\n**CHANDLER:** Okay. Question.\n\n**MONICA:** Mm-hm.\n\n**CHANDLER:** Why are the boxes in a grid?\n\n**MONICA:** They're not in a grid, they're in a *matrix.* Vertical axis is room, horizontal axis is frequency of use.\n\n**CHANDLER:** We got here at nine o'clock last night.\n\n**MONICA:** *(genuinely upset)* I *know!* I lost almost an hour to the twins!\n\n**CHANDLER:** *(looking down at the babies)* You hear that, guys? You're an hour behind. Mommy's very disappointed.\n\n**[He walks to the big window. Looks out. Long beat.]**\n\n**CHANDLER:** We have a lawn.\n\n**MONICA:** We do!\n\n**CHANDLER:** What do I do with it?\n\n**MONICA:** You mow it.\n\n**CHANDLER:** And then?\n\n**MONICA:** It grows.\n\n**CHANDLER:** And then?\n\n**MONICA:** You mow it.\n\n**CHANDLER:** *(long pause)* So it's a hobby with no ending and no purpose that punishes you for participating. *(beat)* I've found my sport.\n\n**[He turns back. Looks at the babies.]**\n\n**CHANDLER:** Okay, seriously \u2014 which one's which again?\n\n**MONICA:** Chandler.\n\n**CHANDLER:** I'm asking!\n\n**MONICA:** Jack is the boy. Erica is the girl.\n\n**CHANDLER:** Right. And I know that how?\n\n**MONICA:** *Chandler.*\n\n**CHANDLER:** I am not going to *check* every time, Monica! It's undignified! For all three of us!\n\n**[The doorbell rings. MONICA's head snaps up like a hunting dog.]**\n\n**MONICA:** Someone's here.\n\n**CHANDLER:** Someone's here.\n\n**MONICA:** Someone came *over.*\n\n**CHANDLER:** Honey, breathe\u2014\n\n**MONICA:** *(already running)* SOMEBODY CAME OVER!\n\n**[She flings open the door. GAIL, a pleasant woman in her forties, stands there with a small welcome basket.]**\n\n**GAIL:** Hi! Gail Bergen, number nine. We just wanted to say welcome to Ashby Lane!\n\n**MONICA:** *(a full second of stunned joy)* Oh my God. *(turning, screaming)* CHANDLER! *(turning back)* Wait right there. Wait right there. Do not move.\n\n**[She sprints off. CHANDLER wanders in with the twins.]**\n\n**CHANDLER:** Hi. Chandler. I live here now, apparently.\n\n**GAIL:** Gail. *(peering at the babies)* Oh, they're *beautiful.* Boy or girl?\n\n**CHANDLER:** *(beat)* ...Yes.\n\n**[MONICA returns, staggering under an enormous basket, roughly the size of a toddler.]**\n\n**MONICA:** Welcome to the neighborhood!\n\n**GAIL:** *(confused)* ...I live here.\n\n**MONICA:** I know! I made fourteen. One for every house on the street. Yours has the good jam because you're closest.\n\n**GAIL:** *(taking it, a little frightened)* That's \u2014 that is *so* thoughtful.\n\n**MONICA:** Also! I noticed the neighborhood association has an open secretary position\u2014\n\n**CHANDLER:** Honey.\n\n**MONICA:** \u2014and I've prepared some thoughts\u2014\n\n**CHANDLER:** Honey.\n\n**MONICA:** *(whipping around, murderous)* **WHAT.**\n\n**CHANDLER:** *(gently)* It's ten in the morning. On our first day.\n\n**[MONICA takes a breath. Turns back to GAIL. Radiant.]**\n\n**MONICA:** I've prepared some thoughts.\n\n---\n\n### SCENE 3\n\n**[Scene: The hallway outside apartments 19 and 20. JOEY comes out of his door with a sandwich. He stops. He looks at the purple door. He tries the handle. Locked.]**\n\n**[He glances both ways down the hall. Then he pulls a key out of his pocket and lets himself in.]**\n\n**[Scene: Apartment 20. Completely empty. Bare floors. The frame is still on the door. Late afternoon light. It's enormous and it's nothing.]**\n\n**[JOEY stands in the middle of it, holding his sandwich.]**\n\n**JOEY:** *(to the room)* Hey.\n\n**[Beat.]**\n\n**JOEY:** ...Yeah. I know, right?\n\n**[He walks a slow circle. Stops where the couch used to be. Sits down on the floor. Eats his sandwich.]**\n\n**[After a moment, he lies down on his back and looks at the ceiling.]**\n\n**JOEY:** *(quietly)* You're way better than my apartment.\n\n**[Fade.]**\n\n---\n\n### SCENE 4\n\n**[Scene: Ross's apartment. RACHEL sits at the table with a legal pad and the phone. EMMA, almost two, is on the floor with a plastic dinosaur. ROSS hovers. He is hovering so hard it has become an athletic event.]**\n\n**RACHEL:** *(on the phone)* Right. Well, if anything opens up \u2014 Rachel. Rachel Green. G-R-E-E-N. Like the color. *(beat)* Sure. Yes. Thank you. *(hangs up)*\n\n**ROSS:** How'd it go?!\n\n**RACHEL:** She said \"we'll keep your r\u00e9sum\u00e9 on file,\" which is a thing people say instead of \"get off my phone.\"\n\n**ROSS:** Okay. Okay! You know what, that's fine, because I've been thinking\u2014\n\n**RACHEL:** Oh boy.\n\n**ROSS:** \u2014and I think this is *great.* thing.]**\n\n**EMMA:** *(softly, into the silence)* Pants.\n\n---\n\n### SCENE 5\n\n**[Scene: Central Perk. RACHEL and PHOEBE on the couch.]**\n\n**PHOEBE:** Okay, so let me get this straight. You have no job, no apartment, no clothes, and no plan.\n\n**RACHEL:** Yes.\n\n**PHOEBE:** Rachel. *(taking her hands, deadly serious)* That's how *I* live. That's my whole thing. You can't just take my whole thing.\n\n**RACHEL:** *(laughing)* Pheebs\u2014\n\n**PHOEBE:** No, seriously, I've been doing this for thirty-five years and I'm *very good at it* and you can't just walk in on day one and be homeless and mysterious. There's a \u2014 there's a *seniority* thing.\n\n**RACHEL:** *(beat)* Okay, can I say something out loud and you can't tell anyone?\n\n**PHOEBE:** I'll try. But I'm bad at it and I want you to know that going in.\n\n**RACHEL:** *(quietly)* I keep thinking about the plane.\n\n**PHOEBE:** Yeah?\n\n**RACHEL:** Not \u2014 not getting off it. Getting *on* it. *(beat)* Pheebs, I sat down in that seat and I put my bag under the seat in front of me and I thought, \"this is the first thing I've ever done that was *only mine.*\" No boyfriend. No father. No dinner where somebody has an opinion. Just me and a job and a city I don't speak the language of. *(beat)* And it was terrifying. And it was the best I've ever felt.\n\n**PHOEBE:** *(gently)* And then?\n\n**RACHEL:** *(beat)* And then I heard his voice.\n\n**[Beat.]**\n\n**PHOEBE:** Okay. So do you want to know what I actually think?\n\n**RACHEL:** *(bracing)* Yes.\n\n**PHOEBE:** I think you didn't get off the plane for Ross.\n\n**RACHEL:** ...I did, though. I pretty specifically did.\n\n**PHOEBE:** No, you got off the plane *because* of Ross. Those are super different. *(beat)* Rachel, you've been doing the same thing since you were, like, nine. You wait for a big enough reason to show up, and then you *react* to it. The dress! The plane! It's always somebody standing in a doorway going \"Rachel!\" and you go, \"well, I *guess* I have to.\" *(beat)* You've never once in your life just... picked a thing. Out of nowhere. For no reason but wanting it.\n\n**[RACHEL stares at her.]**\n\n**RACHEL:** ...That's the meanest thing you've ever said to me.\n\n**PHOEBE:** *(sweetly)* Oh, honey, no it isn't. I once told you your neck was long.\n\n**RACHEL:** *(standing, upset, grabbing her coat)* You know what? I'm gonna go.\n\n**PHOEBE:** Okay!\n\n**RACHEL:** *(at the door, turning back)* And my neck is *fine!*\n\n**PHOEBE:** *(calling after her, warmly)* It's a beautiful neck, Rachel! It's just *long!*\n\n---\n\n### SCENE 6\n\n**[Scene: Apartment 20. Night. Pitch black. Then the door opens and light spills in \u2014 ROSS, silhouetted, holding a bag.]**\n\n**[JOEY is asleep on the floor in the middle of the empty room, under his coat, with the chick and the duck asleep on his chest.]**\n\n**ROSS:** *(flipping a switch. Nothing.)* Joey.\n\n**JOEY:** *(bolting upright)* I'm up! I'm up. *(squinting)* Hey.\n\n**ROSS:** Why are you asleep on the floor of an empty apartment?\n\n**JOEY:** I'm not *asleep*, I *fell* asleep, that's \u2014 that's totally different.\n\n**ROSS:** You have a bed. It's eleven feet that way.\n\n**JOEY:** *(rubbing his face, sitting up properly)* Yeah.\n\n**[ROSS sits down on the floor beside him. Sets the bag between them. Pulls out two beers.]**\n\n**ROSS:** Talk.\n\n**JOEY:** *(long beat)* You know what the thing is? For ten years I could just... walk in. Any time. Middle of the night. Two in the afternoon. I could walk in and there'd be somebody in here. There was *always* somebody in here. *(beat)* Now I gotta call people, Ross. I gotta make *plans.* I'm thirty-six years old and I have to make plans.\n\n**ROSS:** *(beat)* You're thirty-six?\n\n**JOEY:** I'm whatever you need me to be.\n\n**ROSS:** *(nodding, letting it go)* Joey, I'm eleven blocks away. I've been eleven blocks away for six years.\n\n**JOEY:** Yeah, but the door was *open*, man. That's different. *(beat)* Eleven blocks with the door open is nothin'. Eleven blocks with the door *locked* is... eleven blocks.\n\n**[ROSS has nothing. He drinks.]**\n\n**JOEY:** *(gesturing at the room)* And it's not the apartment. I don't want the apartment. I *know* it's an apartment. It's a *box.* Monica used to yell at me in here, it wasn't even that great. *(beat)* But I could walk in.\n\n**[Beat.]**\n\n**ROSS:** *(quietly)* How'd you get a key?\n\n**JOEY:** Treeger.\n\n**ROSS:** How'd you get a key from Treeger?\n\n**JOEY:** *(shrugging, not proud)* I told him I'd dance with him at his niece's wedding.\n\n**ROSS:** ...You *what?*\n\n**JOEY:** He's a big guy, Ross, and he's got nobody, and he *asked*, and I got a key out of it. Everybody wins.\n\n**[ROSS looks at him for a long moment.]**\n\n**ROSS:** You know, sometimes you're the smartest person I know.\n\n**JOEY:** *(instantly, delighted)* Yeah?\n\n**ROSS:** No.\n\n**JOEY:** *(deflating)* Ah.\n\n**[They drink. In the dark. In the empty room.]**\n\n---\n\n### SCENE 7\n\n**[Scene: Ross's apartment. Morning. ROSS is pacing. He's been pacing a while. There's a manila folder on the table and he keeps looking at it and looking away, like it's radioactive. The door opens \u2014 RACHEL, coming in with EMMA and coffee.]**\n\n**RACHEL:** Hi! Okay, so, Bev from the knitwear place called back, which \u2014 I know, but she said\u2014\n\n**ROSS:** I have to tell you something and I need you to let me finish.\n\n**RACHEL:** *(stopping dead)* That's never good.\n\n**ROSS:** I called Mark.\n\n**RACHEL:** ...Mark?\n\n**ROSS:** Mark Robinson. Mark. Your Mark. *The* Mark.\n\n**RACHEL:** *You called Mark?!* Ross, you *hate* Mark! You once described Mark as, and I'm quoting, \"a man-shaped reason we broke up.\"\n\n**ROSS:** *(a flicker of pride)* I did say that. That's very good. I'd forgotten I said that.\n\n**RACHEL:** *Why did you call Mark?*\n\n**ROSS:** *(beat)* I called him at six o'clock in the morning. He was \u2014 honestly? He was really gracious about it. He's married now. He has a boat. He has a *boat*, Rachel, and he mentioned it *twice*, so.\n\n**RACHEL:** *Ross.*\n\n**ROSS:** *(the hard part)* Louis Vuitton hasn't filled the job.\n\n**[Dead silence.]**\n\n**RACHEL:** ...What?\n\n**ROSS:** They can't fill a position like that in a week. They wanted *you.* Mark talked to Nicole in Paris last night. They'll hold it for forty-eight hours. *(beat)* That's what he said. Forty-eight hours.\n\n**[RACHEL sets the coffee down very slowly, like it might go off.]**\n\n**RACHEL:** *(barely audible)* You got me my job back.\n\n**ROSS:** Yeah.\n\n**RACHEL:** In Paris.\n\n**ROSS:** Yeah.\n\n**RACHEL:** *(the volume arriving all at once)* **Why would you DO that?!**\n\n**ROSS:** *(this is costing him)* Because you got off a plane, Rach. And that is the single best thing that has ever happened to me \u2014 it is *going on my tombstone* \u2014 but you didn't *decide* anything. You *reacted.* You heard a voice on a machine and you ran off an airplane. And that's a movie. That's a *great* movie. But it's not a life. *(beat)* And in three years, or five, or twenty \u2014 you're gonna be standing in a kitchen somewhere, and you're gonna think, \"I could've had Paris.\" And I will be the reason you didn't.\n\n**RACHEL:** Ross\u2014\n\n**ROSS:** *(steady)* I've been the reason before.\n\n**[That lands. RACHEL's face does something complicated.]**\n\n**ROSS:** *(quieter)* I don't want to be the reason. I want to be the *choice.* I've never once in ten years been the choice. I've been the accident, and the mistake, and the guy on the answering machine, and the \u2014 the *default.* I want to be the thing you picked. *(beat)* Even if you don't.\n\n**[Long, long pause.]**\n\n**RACHEL:** *(finally, shaking)* I hate you so much right now.\n\n**ROSS:** I know.\n\n**RACHEL:** I *had* it! It was *done!* I got off the plane, it was the whole \u2014 it was the *end of the story*, Ross, and you \u2014 you *gave it back to me!*\n\n**ROSS:** Yes.\n\n**RACHEL:** Now I have to *decide!*\n\n**ROSS:** *(nodding)* Yes.\n\n**[She grabs her coat. Stops at the door. Turns around.]**\n\n**RACHEL:** This is the nicest thing anyone has ever done for me and I have never in my life wanted to hit you more.\n\n**[She goes. The door slams. ROSS stands alone in the middle of the room.]**\n\n**ROSS:** *(to himself, after a beat)* ...I'll take it.\n\n**[COMMERCIAL BREAK]**\n\n---\n\n## ACT TWO\n\n### SCENE 8\n\n**[Scene: Monica and Chandler's kitchen. Westchester. MONICA and RACHEL at the island. MONICA is holding ERICA. There is a legal pad in front of them that already has a chart on it.]**\n\n**MONICA:** Forty-eight hours.\n\n**RACHEL:** Forty-one.\n\n**MONICA:** *(immediately reaching for a pen)* Okay. I'll make a chart.\n\n**RACHEL:** **MONICA.**\n\n**MONICA:** *A small chart!*\n\n**RACHEL:** *(taking the pen away)* No charts. No lists. No pro-con. Mon, I have done pro-con on this man since 1994. I have *retired* undefeated from pro-con.\n\n**MONICA:** *(setting the pen down, hurt)* Well, then what do you want from me?\n\n**RACHEL:** I want you to tell me what to do.\n\n**[Beat.]**\n\n**MONICA:** *(carefully)* I can't do that.\n\n**RACHEL:** You've told me what to do since I was six years old! You told me not to marry Barry! You told me to move to the city! You told me my bangs were a war crime!\n\n**MONICA:** *(instantly)* They were.\n\n**RACHEL:** So *tell me!*\n\n**[MONICA opens her mouth. And then, unexpectedly, her eyes fill.]**\n\n**MONICA:** I don't know.\n\n**RACHEL:** ...What?\n\n**MONICA:** I don't *know*, Rachel! *(setting Erica down in the bassinet, hands shaking)* I've known everything for ten years! I knew *everything!* I knew where everybody was, and who everybody was dating, and what everybody was having for dinner, because *I was making it!* I was the \u2014 I was the switchboard! *(beat)* And now I live in a house on a street with a *name* like a *golf course*, and the grocery store has a     var el = blocks[Math.max(0, Math.min(blocks.length - 1, i))];
    if (!el) return;
    var y = window.pageYOffset + el.getBoundingClientRect().top - 90 - (off || 0);
    window.scrollTo({ top: Math.max(0, y), behavior: "auto" });
  }

  /* ---------- controls ---------- */
  var sizes = ["s", "m", "l", "xl"];
  document.documentElement.dataset.size = (saved && saved.size) || "m";
  document.getElementById("type").addEventListener("click", function () {
    var cur = sizes.indexOf(document.documentElement.dataset.size || "m");
    var next = sizes[(cur + 1) % sizes.length];
    var keep = topBlock();
    document.documentElement.dataset.size = next;
    goto(keep, 0);
    commit();
  });

  var sheet = document.getElementById("sheet");
  document.getElementById("menu").addEventListener("click", function () {
    tocEl.querySelectorAll("button").forEach(function (b) {
      b.dataset.read = (+b.dataset.i <= furthest) ? "1" : "0";
    });
    sheet.dataset.open = "1";
  });
  sheet.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    sheet.dataset.open = "0";
    if (b) { goto(+b.dataset.i, 0); commit(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") sheet.dataset.open = "0"; });

  resume.addEventListener("click", function () {
    goto(openMark, openOff);
    commit();
  });

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", paint);
  document.addEventListener("visibilitychange", function () { if (document.hidden) commit(); });
  window.addEventListener("pagehide", commit);

  /* ---------- open where they left off ---------- */
  if (saved && saved.i > 0) {
    goto(saved.i, saved.off || 0);
    setTimeout(function () { goto(saved.i, saved.off || 0); paint(); }, 60);
  }
  paint();
})();
</script>

</body>
</html>
