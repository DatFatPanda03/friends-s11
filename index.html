  [data-theme="paper"] {

    --faint: #8C8090; --rule: #E4DAE3; --accent: #7A3E8F; --accent-soft: #F0E5F3;

  }
  [data-theme="night"] {
    --ground: #17121A; --raise: #211A25; --ink: #EDE6EE; --muted: #9E92A3;
    --faint: #857A8A; --rule: #322936; --accent: #C08BD6; --accent-soft: #2C2032;

  }

  }

  :root[data-size="s"] { --size: .9375rem; }
  :root[data-size="l"] { --size: 1.1875rem; }
  :root[data-size="xl"] { --size: 1.375rem; }

  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 5.5rem; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: var(--size);
    line-height: 1.62;
    margin: 0;
    overflow-wrap: break-word;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  /* ---- header ---- */
  header {
    position: fixed; inset: 0 0 auto 0; z-index: 40;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--rule);
    padding-top: env(safe-area-inset-top);
  }
  .bar {
    display: flex; align-items: center; gap: .5rem;
    max-width: 40rem; margin: 0 auto; padding: .5rem .75rem;
  }
  .where {
    flex: 1; min-width: 0;
    font-family: var(--sans); font-size: .6875rem; font-weight: 600;
    letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pct { font-family: var(--sans); font-size: .6875rem; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .icon {
    width: 2rem; height: 2rem; flex: none; border-radius: 999px;
    display: grid; place-items: center;
    font-family: var(--sans); font-size: .75rem; font-weight: 700;
    color: var(--muted); border: 1px solid var(--rule); background: var(--raise);
  }
  .icon:hover { color: var(--accent); border-color: var(--accent); }
  .icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

  .rail { height: 3px; background: var(--rule); position: relative; }
  .rail > i { position: absolute; inset: 0 auto 0 0; background: var(--gold); width: 0; transition: width .18s linear; }
  .rail > b { position: absolute; top: -2px; width: 2px; height: 7px; background: var(--accent); opacity: 0; }

  /* ---- scene sheet ---- */
  .sheet {
    position: fixed; z-index: 39; inset: 0 0 0 0;
    background: color-mix(in srgb, var(--ground) 70%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none;
  }
  .sheet[data-open="1"] { display: block; }
  .sheet nav {
    position: absolute; inset: auto 0 0 0; max-height: 72vh; overflow-y: auto;
    background: var(--raise); border-top: 1px solid var(--rule);
    box-shadow: var(--shadow); border-radius: 16px 16px 0 0;
    padding: .75rem .5rem calc(1.25rem + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }
  .sheet nav > div { max-width: 40rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1px; }
  .sheet button {
    display: flex; gap: .75rem; align-items: baseline; width: 100%; text-align: left;
    padding: .6rem .75rem; border-radius: 8px; font-family: var(--sans); font-size: .875rem; line-height: 1.35;
  }
  .sheet button:hover { background: var(--accent-soft); }
  .sheet button[data-act="1"] {
    font-size: .6875rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); padding-top: 1rem;
  }
  .sheet button > span:first-child { color: var(--faint); font-variant-numeric: tabular-nums; font-size: .75rem; flex: none; width: 1.75rem; }
  .sheet button[data-read="1"] > span:first-child { color: var(--gold); }
  .sheet button[data-ep] { font-family: var(--serif); font-size: .95rem; }
  .sheet button[data-ep] > span:first-child { color: var(--faint); font-family: var(--sans); font-size: .6875rem; width: auto; margin-right: .1rem; }
  .sheet button[data-ep][aria-current="true"] { background: var(--accent-soft); }
  .sheet button[data-ep][aria-current="true"] > span:last-child { color: var(--accent); font-weight: 600; }

  /* ---- resume pill ---- */
  .resume {
    position: fixed; z-index: 38; left: 50%; transform: translate(-50%, 1.5rem);
    bottom: calc(1rem + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: .5rem;
    padding: .6rem 1rem; border-radius: 999px;
    background: var(--accent); color: var(--on-accent);
    font-family: var(--sans); font-size: .8125rem; font-weight: 600;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .resume[data-show="1"] { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

  /* ---- display panel ---- */
  .panel { padding: .25rem .5rem; gap: 0 !important; }
  .grouplabel {
    font-family: var(--sans); font-size: .625rem; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
    margin: .75rem .25rem .6rem;
  }
  .grouplabel:first-child { margin-top: .25rem; }
  .row { display: flex; gap: .5rem; }
  .sheet .panel button {
    width: auto; display: grid; place-items: center; text-align: center;
    border: 1px solid var(--rule); background: var(--raise);
    border-radius: 10px; padding: 0;
  }
  .sheet .panel .row button {
    flex: 1; height: 3rem; font-family: var(--serif); color: var(--muted);
  }
  .sheet .panel button:hover { border-color: var(--accent); }
  .sheet .panel button[aria-pressed="true"] {
    border-color: var(--accent); background: var(--accent-soft); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; }
  .sheet .panel .swatches button {
    aspect-ratio: 1; background: var(--ground); position: relative; overflow: hidden;
  }
  .swatches button > i {
    width: 42%; aspect-ratio: 1; border-radius: 999px; background: var(--accent);
    box-shadow: 0 0 0 3px var(--raise), 0 0 0 4px var(--rule);
  }
  .swatches button > u {
    position: absolute; inset: auto 0 0 0; height: 26%;
    background: var(--ink); opacity: .82; text-decoration: none;
  }
  .swatches button[data-t="auto"] {
    background: linear-gradient(105deg, #F6F2F4 0 50%, #17121A 50% 100%) !important;
  }
  .swatches button[data-t="auto"] > i { background: #7A3E8F; box-shadow: 0 0 0 3px #FFFFFF; }
  .swatches button[data-t="auto"] > u { display: none; }
  .swname {
    font-family: var(--sans); font-size: .6875rem; color: var(--muted);
    margin: .6rem .25rem 0; min-height: 1em;
  }

  /* ---- script body ---- */
  main {
    max-width: 34rem; margin: 0 auto;
    padding: 5.25rem 1.25rem 60vh;
    padding-left: max(1.25rem, env(safe-area-inset-left));
    padding-right: max(1.25rem, env(safe-area-inset-right));
  }
  .titleblock { margin-bottom: 3rem; text-align: center; }
  .titleblock .show {
    font-family: var(--sans); font-size: .75rem; font-weight: 700;
    letter-spacing: .48em; text-indent: .48em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 1.25rem;
  }
  .titleblock h1 {
    font-family: var(--serif); font-weight: 400; font-size: 1.9rem; line-height: 1.2;
    text-wrap: balance; margin: 0 0 .75rem; font-style: italic;
  }
  .titleblock .ep, .titleblock .note {
    font-family: var(--sans); font-size: .75rem; color: var(--muted); margin: 0;
  }
  .titleblock .ep { letter-spacing: .1em; text-transform: uppercase; margin-bottom: .5rem; }
  .titleblock .note { font-style: italic; margin-top: .75rem; }

  h2.act {
    font-family: var(--sans); font-size: .6875rem; font-weight: 700;
    letter-spacing: .28em; text-indent: .28em; text-transform: uppercase;
    color: var(--accent); text-align: center;
    margin: 3.5rem 0 2rem; padding-top: 1.75rem; border-top: 1px solid var(--rule);
  }
  .scenenum {
    display: flex; align-items: center; gap: .6rem;
    font-family: var(--sans); font-size: .625rem; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase; color: var(--faint);
    margin: 2.75rem 0 1.25rem;
  }
  .scenenum::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .scenenum + .stage { margin-top: 0; }
  .stage {
    font-family: var(--mono); font-size: .8125em; line-height: 1.6; font-style: italic;
    color: var(--muted); margin: 1.75rem 0; padding-left: .875rem;
    border-left: 2px solid var(--rule);
  }
  .line { margin: 1.25rem 0; }
  .cue {
    display: block; font-family: var(--mono); font-size: .6875em; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
    margin-bottom: .1rem;
  }
  .line p { margin: 0; }
  .line em, .stage em { font-style: italic; }
  .line em.paren { color: var(--muted); font-family: var(--mono); font-size: .8em; }
  hr { border: 0; height: 1px; background: var(--rule); margin: 2.5rem auto; width: 4rem; }
  .plain { margin: 1.25rem 0; color: var(--muted); font-style: italic; }
  .end {
    font-family: var(--sans); font-size: .6875rem; font-weight: 700; letter-spacing: .28em;
    text-transform: uppercase; text-align: center; color: var(--faint); margin: 3rem 0 0;
  }
  .mark { position: relative; }
  .mark::before {
    content: ""; position: absolute; left: -1.25rem; top: .35em;
    width: 3px; height: 1.2em; border-radius: 2px; background: var(--gold);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto !important; } }
</style>

      md: "# FRIENDS\n## Season 11, Episode 1\n# \"The One After Rachel Got Off the Plane\"\n\n*Picks up the morning after \"The Last One, Part 2.\"*\n\n---\n\n## TEASER\n\n**[Scene: Ross's apartment. Morning. ROSS and RACHEL in bed, both awake, staring at the ceiling, grinning like idiots.]**\n\n**ROSS:** You got off the plane.\n\n**RACHEL:** I got off the plane.\n\n**ROSS:** You got off the plane.\n\n**RACHEL:** Honey. We've been doing this since four in the morning.\n\n**ROSS:** Every time I say it, it's still true. It's like a magic trick that keeps working.\n\n**RACHEL:** *(laughing)* Okay. Can I ask you something?\n\n**ROSS:** Anything.\n\n**RACHEL:** What am I wearing tomorrow?\n\n**ROSS:** *(sincerely)* Personally, I'm a big fan of what you're wearing right now\u2014\n\n**RACHEL:** Ross. Everything I own is on a boat.\n\n**ROSS:** ...What?\n\n**RACHEL:** A boat! To France! I packed my entire life into a shipping container and mailed it to a country I am no longer in.\n\n**ROSS:** So what do you have?\n\n**RACHEL:** My purse, the clothes I flew in, and a duty-free Toblerone.\n\n**ROSS:** *(beat)* Well, that's not nothing. That's a *big* Toblerone.\n\n**RACHEL:** It is currently the largest thing I own. *(beat)* Ross, I don't have a job. I don't have an apartment. I don't have *pants.*\n\n**ROSS:** *(a beat too long. Then, quietly)* You have me.\n\n**[She looks at him. Everything softens.]**\n\n**RACHEL:** ...I have you.\n\n**[Beat.]**\n\n**RACHEL:** Do you have pants?\n\n**ROSS:** I have *so many* pants. I have pants I don't even *like.*\n\n**RACHEL:** Why do you have pants you don't like?\n\n**ROSS:** Because they were on *sale*, Rachel. I am a man who buys pants at *volume.*\n\n**RACHEL:** *(gathering the sheet)* Okay. Show me the pants.\n\n**ROSS:** *(leaping out of bed)* I have waited ten years for you to say that!\n\n**[He bolts out of frame. Beat. An enormous crash.]**\n\n**ROSS:** *(O.S.)* I'm fine! Don't come in!\n\n**[OPENING CREDITS]**\n\n---\n\n## ACT ONE\n\n### SCENE 1\n\n**[Scene: Central Perk. JOEY on the couch eating a muffin with his hands like an animal. PHOEBE beside him with a clipboard, very official.]**\n\n**PHOEBE:** Attendance. Joey.\n\n**JOEY:** Here.\n\n**PHOEBE:** *(a mark)* Ross and Rachel are late. Demerit each.\n\n**JOEY:** Pheebs. What is that?\n\n**PHOEBE:** It's the schedule. Monica's gone. Somebody has to make us do stuff. *(beat)* Joey, do you know why we saw each other every day for ten years? It wasn't love. It was proximity, and a controlling woman.\n\n**JOEY:** That's not true.\n\n**PHOEBE:** Name one time we made a plan.\n\n**JOEY:** *(opens his mouth. Closes it.)* ...I'm listening.\n\n**PHOEBE:** Everybody gets a day. Mondays are you. Tuesdays are Ross \u2014 Ross doesn't know yet, Ross is going to have *opinions.*\n\n**JOEY:** What about Friday?\n\n**PHOEBE:** Friday is me.\n\n**JOEY:** What do we do on Fridays?\n\n**PHOEBE:** *(gestures at the couch, the coffee, the two of them)* This. Exactly this. Fridays are already perfect. Don't touch Fridays.\n\n**JOEY:** *(genuinely moved)* ...I love Fridays.\n\n**PHOEBE:** *(a mark)* Noted. *(beat)* Also, I can't fly anymore.\n\n**JOEY:** What?\n\n**PHOEBE:** I brought down a commercial aircraft using nothing but the power of my *voice.*\n\n**JOEY:** You told *Rachel.* On the *phone.* From the *cab.*\n\n**PHOEBE:** And who told Rachel, Joey?\n\n**JOEY:** ...You did.\n\n**PHOEBE:** *(satisfied)* I was the *architect.*\n\n**JOEY:** So you're on a list for something Rachel said out loud?\n\n**PHOEBE:** *(igniting)* Yes! Rachel said it to a hundred and forty *strangers* and Rachel can fly *anywhere.* I made one call from a *parked car* and now I can't go to Cleveland.\n\n**JOEY:** Why do you wanna go to Cleveland?\n\n**PHOEBE:** I don't. *(beat)* But I want it to be *available* to me.\n\n**[The door opens. ROSS and RACHEL enter holding hands, radiating. RACHEL wears a men's button-down four sizes too big \u2014 and a pair of ROSS's pants. Pleated. High-waisted. The worst pants ever manufactured. Cuffed roughly six times.]**\n\n**ROSS:** *(to the entire coffee house)* Good morning, everyone!\n\n**[PHOEBE and JOEY stare. Long beat.]**\n\n**PHOEBE:** *(two marks)* Demerit. Demerit.\n\n**JOEY:** *(unable to look away)* Rach.\n\n**RACHEL:** *(flat)* Don't.\n\n**JOEY:** Rach, what are you\u2014\n\n**RACHEL:** Everything I own is in the Atlantic Ocean, Joey.\n\n**JOEY:** Sure, but those are\u2014\n\n**RACHEL:** I *know* what they are.\n\n**ROSS:** *(unable to stop himself)* They're mine.\n\n**RACHEL:** Ross.\n\n**ROSS:** *(to Joey, quietly, thrilled)* Those are my pants.\n\n**PHOEBE:** *(peering)* Are they *supposed* to come up to there?\n\n**ROSS:** They're supposed to come up to *here*, Phoebe. That's the *design.* That is a *deliberate silhouette.*\n\n**JOEY:** So tell it! The airport! I fell asleep during the good part!\n\n**ROSS:** *(leaning in, cinematic)* Okay. So. I'm sprinting \u2014 full sprint\u2014\n\n**PHOEBE:** You were in my cab. I was *driving.*\n\n**ROSS:** I sprinted *inside* the cab.\n\n**PHOEBE:** You can't sprint inside a cab, Ross. That's just *sitting.*\n\n**RACHEL:** Also it was eleven minutes. I've seen the meter.\n\n**PHOEBE:** I charged him.\n\n**ROSS:** You *charged* me?!\n\n**PHOEBE:** I have a *business*, Ross.\n\n**JOEY:** And then?!\n\n**ROSS:** And then I burst through the doors \u2014 and there's a *nun*\u2014\n\n**RACHEL:** There's no nun.\n\n**ROSS:** There's *always* a nun in an airport, Rachel. It's an *airport.*\n\n**RACHEL:** Ross, I was *there.*\n\n**ROSS:** You were at the *gate!* You didn't see the *concourse!*\n\n**JOEY:** What gate?\n\n**ROSS:** Gate fourteen.\n\n**RACHEL:** Gate forty.\n\n**ROSS:** *(gravely)* It *felt* like fourteen.\n\n**[GUNTHER approaches. He stops dead when he sees RACHEL. He does not blink.]**\n\n**GUNTHER:** You're back.\n\n**RACHEL:** *(bright)* I am!\n\n**GUNTHER:** You're going to be *here.* Every day. Forever.\n\n**RACHEL:** *(charmed)* Isn't that nice?\n\n**[Long pause.]**\n\n**GUNTHER:** I told everyone.\n\n**RACHEL:** ...What?\n\n**GUNTHER:** I told you I loved you. You said you loved me too.\n\n**RACHEL:** I said \"probably not in the same way\"\u2014\n\n**GUNTHER:** You said the *words*, Rachel. Then you left the country, and I thought \u2014 well. That's a very sad, very beautiful, *finished* story. So I told everyone. I told the regulars. I told my mother. I told the man who delivers the milk.\n\n**RACHEL:** Gunther\u2014\n\n**GUNTHER:** I bought a suit.\n\n**RACHEL:** You bought a\u2014\n\n**GUNTHER:** It's a *good* suit, Rachel.\n\n**[He turns and addresses the entire coffee house, flat.]**\n\n**GUNTHER:** SHE'S BACK. IT'S FINE. EVERYTHING'S FINE. *(beat)* NOBODY LOOK AT ME.\n\n**[He walks away.]**\n\n**PHOEBE:** *(quietly, a mark)* That was worth the demerit.\n\n---\n\n### SCENE 2\n\n**[Scene: Ross's apartment. RACHEL at the table with a legal pad and the phone, still in the pants. EMMA on the floor with a plastic dinosaur. ROSS hovers so hard it has become an athletic event.]**\n\n**RACHEL:** *(hanging up)* She said \"we'll keep your r\u00e9sum\u00e9 on file,\" which is a thing people say instead of \"get off my phone.\"\n\n**ROSS:** That's fine, because I think this is *great.* You have *time!* You could take a class. You could *read.* Have you read *Wonderful Life*\u2014\n\n**RACHEL:** Is that about a woman with no job?\n\n**ROSS:** It's about the Burgess Shale.\n\n**RACHEL:** *(beat)* Is *that* about a woman with no job?\n\n**ROSS:** *(beat)* ...It's about a *quarry.*\n\n**[He checks the calendar on the fridge.]**\n\n**ROSS:** I've got Ben Saturday. Zoo, or the one where he asks why I don't live with him and I lie down on the floor of a Sbarro?\n\n**RACHEL:** Zoo.\n\n**ROSS:** Zoo.\n\n**RACHEL:** *(standing, pacing)* Ross, a hundred and forty people applied for that job. I was going to run their *Paris operation.* I was going to have an *assistant* with an *assistant.* *(beat)* Now I'm on the phone with a woman named Bev at a knitwear company in Long Island City. In *your pants.*\n\n**ROSS:** *(carefully)* But you're happy.\n\n**[RACHEL stops.]**\n\n**RACHEL:** *(honestly)* I'm so happy it's making me nauseous.\n\n**ROSS:** *(triumphant)* See!\n\n**RACHEL:** Ross, both things are true at once! That's what being an adult *is.* Two true things sitting on top of each other making you insane.\n\n**[EMMA looks up.]**\n\n**EMMA:** Pants!\n\n**[Both parents freeze.]**\n\n**RACHEL:** ...What did she say?\n\n**ROSS:** *(delighted, horrified)* She said \"pants.\"\n\n**EMMA:** *(clearly, proudly)* PANTS.\n\n**RACHEL:** *(gesturing at herself)* Well. She's not *wrong.*\n\n**ROSS:** *(scooping her up)* That's a great word! That's a *noun*, Rach, that's a *concrete noun*, developmentally that's\u2014\n\n**RACHEL:** *ROSS.*\n\n**ROSS:** *(beat)* ...Yeah?\n\n**[He sets EMMA down. Something changes in him.]**\n\n**ROSS:** I have to tell you something and I need you to let me finish.\n\n**RACHEL:** *(stopping dead)* That's never good.\n\n**ROSS:** I called Mark.\n\n**RACHEL:** ...Mark?\n\n**ROSS:** Mark Robinson. Mark. Your Mark. *The* Mark.\n\n**RACHEL:** *You called Mark?!* Ross, you *hate* Mark. You once described Mark as, and I'm quoting, \"a man-shaped reason we broke up.\"\n\n**ROSS:** *(a flicker of pride)* I did say that. That's very good. I'd forgotten I said that.\n\n**RACHEL:** *Why did you call Mark?*\n\n**ROSS:** Six this morning. He was gracious about it. He's married. He has a boat. He has a *boat*, Rachel, and he mentioned it *twice*, so.\n\n**RACHEL:** *Ross.*\n\n**ROSS:** *(the hard part)* Louis Vuitton hasn't filled the job.\n\n**[Dead silence.]**\n\n**RACHEL:** ...What?\n\n**ROSS:** You can't fill a position like that in a week. They wanted *you.* Mark talked to Nicole in Paris last night. They'll hold it until Thursday morning.\n\n**[RACHEL sets down the legal pad very slowly, like it might go off.]**\n\n**RACHEL:** *(barely audible)* You got me my job back.\n\n**ROSS:** Yeah.\n\n**RACHEL:** *(the volume arriving all at once)* **Why would you DO that?!**\n\n**ROSS:** Because in five years you're going to be standing in a kitchen somewhere thinking \"I could've had Paris.\" *(beat)* And I'd be the reason.\n\n**RACHEL:** Ross\u2014\n\n**ROSS:** I've *been* the reason before. I have a very bad record with it. *(quieter)* You got off that plane and it's the best thing that ever happened to me. It's going on my *tombstone.* And I've spent every hour since wondering what it cost you.\n\n**[Long pause.]**\n\n**RACHEL:** *(shaking)* I hate you so much right now.\n\n**ROSS:** I know.\n\n**RACHEL:** I *had* it! It was *done!* It was the end of the story and you *gave it back to me!*\n\n**ROSS:** Yes.\n\n**RACHEL:** Now I have to *decide!*\n\n**ROSS:** *(nodding)* Yes.\n\n**[She grabs her coat. Stops at the door. Turns around.]**\n\n**RACHEL:** This is the nicest thing anyone has ever done for me and I have never in my life wanted to hit you more.\n\n**[She goes. The door slams.]**\n\n**[COMMERCIAL BREAK]**\n\n---\n\n## ACT TWO\n\n### SCENE 3\n\n**[Scene: Apartment 20. Night. Pitch black. The door opens and light spills in \u2014 ROSS with a bag. JOEY is asleep on the floor in the middle of the empty room, under his coat, CHICK JR. and DUCK JR. on his chest.]**\n\n**ROSS:** Joey.\n\n**JOEY:** *(bolting upright)* I'm up! *(squinting)* Hey.\n\n**ROSS:** Why are you asleep on the floor of an empty apartment?\n\n**JOEY:** I'm not *asleep.* I *fell* asleep. Totally different.\n\n**ROSS:** You have a bed. It's eleven feet that way.\n\n**JOEY:** Yeah.\n\n**ROSS:** You brought the birds?\n\n**JOEY:** They like it in here. *(beat)* They remember.\n\n**ROSS:** They're *birds*, Joey.\n\n**JOEY:** *(firmly)* They *remember*, Ross.\n\n**[ROSS sits down on the floor beside him. Pulls out two beers.]**\n\n**ROSS:** Talk.\n\n**JOEY:** For ten years I could just... walk in. Any time. Middle of the night. There was *always* somebody in here. *(beat)* Now I gotta call people. I gotta make *plans.* I'm thirty-six years old and I have to make plans.\n\n**ROSS:** *(beat)* You're thirty-six?\n\n**JOEY:** I'm whatever you need me to be.\n\n**ROSS:** *(letting it go)* Joey, I'm across the street. I've been across the street five years.\n\n**JOEY:** Yeah, but the door was *open*, man. Across the street with the door open is nothin'. Across the street with the door *locked* is a *street.*\n\n**[ROSS has nothing. He drinks.]**\n\n**JOEY:** And it's not the apartment. I don't *want* the apartment. It's a *box.* Monica used to yell at me in here. It wasn't even that great. *(beat)* I want one place in this city I can walk into without calling first. That's the whole list.\n\n**ROSS:** How'd you even get a key?\n\n**JOEY:** Treeger. *(off Ross's look)* I told him I'd dance with him at his niece's wedding.\n\n**ROSS:** ...You *what?*\n\n**JOEY:** He's a big guy, he's got nobody, he *asked*, and I got a key out of it. Everybody wins.\n\n**[ROSS looks at him a long moment.]**\n\n**ROSS:** Sometimes you're the smartest person I know.\n\n**JOEY:** *(delighted)* Yeah?\n\n**ROSS:** No.\n\n**JOEY:** *(deflating)* Ah.\n\n**[They drink.]**\n\n**ROSS:** Treeger say what happens to it?\n\n**JOEY:** *(far too quickly)* Nothing happens to it. Why would something happen to it? It's an *apartment*, Ross. Apartments *sit* there, that's the whole\u2014\n\n**ROSS:** Joey.\n\n**JOEY:** *(scrambling up)* I'm gonna go.\n\n**ROSS:** You're doing the face.\n\n**JOEY:** I don't *have* a face!\n\n**ROSS:** You have *one* face, Joey, and right now it is *doing something!*\n\n**JOEY:** *(at the door, agonized)* ROSS. I made a *promise.* To a *man.* In a *suit.*\n\n**ROSS:** *What* man?!\n\n**JOEY:** *(beat)* ...A tall man.\n\n**[He goes. ROSS alone on the floor in the dark with two beers and two birds.]**\n\n**ROSS:** *(calling after him)* THAT'S EVERY MAN, JOEY!\n\n---\n\n### SCENE 4\n\n**[Scene: Central Perk. Wednesday. MONICA and CHANDLER on the couch, a car seat on either side, looking like people who have driven a long way. PHOEBE and JOEY in the chairs. RACHEL pacing, still in the pants. GUNTHER is working \u2014 wiping the counter, collecting cups, drifting in and out of the scene throughout.]**\n\n**CHANDLER:** Fifty-two minutes, nine stops, and a man across from me clipped his fingernails onto the floor of a moving train like *an animal in a fable.*\n\n**PHOEBE:** Why are you here on a Wednesday? Wednesdays are Rachel.\n\n**MONICA:** *(tight)* Because I lost an election, Phoebe.\n\n**JOEY:** You ran for something?\n\n**MONICA:** Block captain. I called a vote.\n\n**RACHEL:** *(stopping)* You've lived there six days.\n\n**CHANDLER:** She went door to door.\n\n**MONICA:** *(defensive)* Twelve houses. Two of them saw me coming.\n\n**PHOEBE:** And?\n\n**MONICA:** Gail got eleven.\n\n**JOEY:** And you got\u2014\n\n**MONICA:** Me.\n\n**CHANDLER:** *(beat)* Who did *I* vote for?\n\n**MONICA:** Gail.\n\n**CHANDLER:** I *what?*\n\n**MONICA:** I filled out yours! I was being *fair!* *(beat)* And it made the margin look better.\n\n**CHANDLER:** It made the margin *eleven to one!*\n\n**[PHOEBE leans over a car seat.]**\n\n**PHOEBE:** Which one's this?\n\n**CHANDLER:** That's Jack.\n\n**PHOEBE:** How do you know?\n\n**CHANDLER:** *(beat)* Systems, Phoebe.\n\n**MONICA:** He labeled them.\n\n**PHOEBE:** *(delighted)* That is *amazing.*\n\n**CHANDLER:** THANK you.\n\n**PHOEBE:** I meant it's amazing that you *let* him.\n\n**MONICA:** *(dark)* I peeled them off. He put them back.\n\n**CHANDLER:** I put them on the *inside* now. It's a *private* system.\n\n**[Laughter. GUNTHER arrives with a coffee pot. JOEY goes rigid.]**\n\n**GUNTHER:** *(refilling, pleasant)* More coffee?\n\n**JOEY:** *(far too loud)* NO.\n\n**[Everyone looks at him. GUNTHER moves on, unbothered.]**\n\n**MONICA:** ...Okay. *(to Rachel)* What's with *you?*\n\n**RACHEL:** Ross got me my job back.\n\n**[Everyone turns.]**\n\n**PHOEBE:** *The Paris one?*\n\n**RACHEL:** They held it. Till tomorrow morning.\n\n**MONICA:** *(instantly reaching for a pen)* Okay. I'll make a chart.\n\n**RACHEL:** **MONICA.**\n\n**MONICA:** *A small chart!*\n\n**RACHEL:** *(taking the pen)* No charts. No pro-con. Mon, I have done pro-con on this man since 1994. I have *retired* undefeated from pro-con.\n\n**[GUNTHER drifts back through with a tray. JOEY stands up so fast his chair moves.]**\n\n**JOEY:** NOTHING'S HAPPENING WITH THE APARTMENT.\n\n**[Everyone turns and looks at him. GUNTHER pauses \u2014 the smallest possible reaction \u2014 and keeps walking.]**\n\n**RACHEL:** ...What?\n\n**JOEY:** Nothing! I said *nothing!*\n\n**MONICA:** Joey.\n\n**JOEY:** *(collapsing immediately)* Treeger rented it. Somebody moves in on the first.\n\n**[Silence. RACHEL stops pacing.]**\n\n**RACHEL:** ...The apartment's gone.\n\n**JOEY:** *(miserable)* Yeah.\n\n**[Beat. Something settles over RACHEL's face \u2014 not tears. Arithmetic.]**\n\n**RACHEL:** *(quietly)* Then I'm going.\n\n**PHOEBE:** ...What?\n\n**RACHEL:** I'm going to Paris.\n\n**MONICA:** Rachel\u2014\n\n**RACHEL:** No \u2014 Mon, *look* at it. I got off a plane for a life that ended six days ago. The apartment's rented. You're in *Westchester.* *(beat)* I gave up the one thing that was actually *mine* to come back to a room that isn't there anymore.\n\n**MONICA:** *(standing)* We're right here.\n\n**RACHEL:** *(not unkindly)* Mon. You drove an hour to sit here. *(beat)* You *drove.*\n\n**[MONICA has nothing. She sits back down.]**\n\n**PHOEBE:** *(very quietly)* If you go, I'll never see you again.\n\n**RACHEL:** Pheebs\u2014\n\n**PHOEBE:** No, *literally.* I can't get on an airplane in this country ever again. So you'll go to France, and I will stand in this room for the rest of my life. *(beat)* Those are just facts. That's not pressure.\n\n**RACHEL:** *(gathering her coat)* That is entirely pressure.\n\n**[She goes.]**\n\n**CHANDLER:** *(after a moment)* ...Does so * And how many people work here?\n\n**BEV:** *(beat)* You're looking at a lot of 'em. *(beat)* You know where the money is? Cable. I'm gonna be on QVC before I die.\n\n**[She walks off. RACHEL stands there. Then \u2014 she can't help it \u2014 she looks at the wall of sweaters beside her. Something in her face changes. She pulls one sweater, moves two others, and steps back.]**\n\n**BEV:** *(O.S.)* Green! Vest!\n\n**RACHEL:** *(not moving, looking at the wall)* Bev. Come here a second.\n\n**[BEV returns, annoyed. Looks at the wall. Stops.]**\n\n**BEV:** ...What did you do.\n\n**RACHEL:** Nothing. I moved four sweaters.\n\n**[BEV looks at it. And looks at it.]**\n\n**BEV:** *(grudging, furious)* It's better.\n\n**RACHEL:** *(radiant, trying not to be)* I *know.*\n\n**BEV:** *(leaving)* Nine to six. Fridge in the back, don't touch the top shelf. *(beat, without turning)* And Green \u2014 the ears thing. Don't say the ears thing to anybody.\n\n---\n\n### SCENE 3\n\n**[Scene: Central Perk. Wednesday afternoon. ROSS alone with a coffee. AARON SLOANE enters \u2014 twenty-seven, corduroy, open face, carrying a cardboard box with great care. He is the nicest man alive.]**\n\n**SLOANE:** Dr. Geller?\n\n**ROSS:** *(rising, cold, formal)* Dr. Sloane.\n\n**SLOANE:** Aaron. Please. *(setting the box down)* Your secretary said you'd be at a coffee house between two and four. She said it with a lot of confidence.\n\n**ROSS:** *(a beat)* ...She had no right.\n\n**SLOANE:** I brought your things. I didn't let the movers do it, I did it myself, and I labeled everything, and \u2014 I hope this isn't weird \u2014 I watered your plant.\n\n**ROSS:** You watered my plant.\n\n**SLOANE:** It was *very* thirsty.\n\n**[ROSS looks into the box. Takes out a stapler. Examines it.]**\n\n**ROSS:** This isn't my stapler.\n\n**SLOANE:** *(stricken)* Are you sure?\n\n**ROSS:** Mine was black. This is charcoal.\n\n**SLOANE:** I'll go back and get it.\n\n**ROSS:** It's a fifteen-minute walk.\n\n**SLOANE:** *(already standing)* That's fine, honestly\u2014\n\n**ROSS:** SIT DOWN.\n\n**[SLOANE sits. Beat.]**\n\n**ROSS:** *(dangerously pleasant)* So. How are you finding it.\n\n**SLOANE:** *(lighting up, helpless)* Oh, it's \u2014 I mean, it's the best room in the building. And it has a *radiator.* An actual cast-iron radiator. I'm from Pasadena, Dr. Geller, I have never in my life *had* a radiator.\n\n**ROSS:** *(flat)* It'll do things at night.\n\n**SLOANE:** *(thrilled)* I *hope* so.\n\n**[Beat.]**\n\n**SLOANE:** Can I say something? Your ninety-six paper. The *Sinosauropteryx* response. *(beat)* That paper is why I'm in the field.\n\n**[ROSS opens his mouth. Nothing comes out.]**\n\n**SLOANE:** I read it freshman year. I was nineteen.\n\n**[ROSS closes his mouth.]**\n\n**SLOANE:** *(standing, gathering himself)* Anyway. I'm around Tuesdays and Thursdays if you ever want to \u2014 I don't know. Get a coffee. Argue about feathers.\n\n**ROSS:** *(a strangled, gracious noise)* Mm.\n\n**SLOANE:** *(at the door)* Oh \u2014 the trilobite on the windowsill. That's a cast, right?\n\n**ROSS:** It's a cast.\n\n**SLOANE:** I know. I looked it up. *(beat)* I just wanted to say it out loud to somebody who'd care.\n\n**[He goes. ROSS sits down slowly with the box on his lap. GUNTHER arrives with the pot.]**\n\n**GUNTHER:** Refill?\n\n**ROSS:** *(bleakly)* Yeah.\n\n**GUNTHER:** *(pouring)* Rough one?\n\n**ROSS:** They gave away my office.\n\n**GUNTHER:** *(beat)* People are terrible.\n\n**ROSS:** *(with feeling)* THANK you.\n\n**GUNTHER:** *(moving off)* I got an apartment.\n\n**ROSS:** *(not listening, staring into the box)* Good for you, man.\n\n---\n\n### SCENE 4\n\n**[Scene: The hallway outside 19 and 20. ROSS comes up the stairs with the box. He stops in front of the purple door. He doesn't want to go home. He knocks \u2014 the old knock, without thinking. The door opens. GUNTHER. Apron. Wooden spoon.]**\n\n**GUNTHER:** Hey, Ross.\n\n**[ROSS looks at the spoon. Looks at the apron. Looks past him into a fully furnished apartment.]**\n\n**ROSS:** ...What.\n\n**GUNTHER:** You want to come in? Food's twenty minutes.\n\n**ROSS:** *(very carefully)* Gunther. Why are you in Monica's apartment.\n\n**GUNTHER:** I live here.\n\n**ROSS:** Since *when?*\n\n**GUNTHER:** The first.\n\n**ROSS:** IT'S THE NINTH.\n\n**GUNTHER:** *(nodding)* Yeah, I got a lot done.\n\n**[ROSS stares past him at the couch. At the chairs. At the table under the window.]**\n\n**ROSS:** *(quietly, to himself)* ...I'm having a day.\n\n**GUNTHER:** I told you I got an apartment.\n\n**ROSS:** YOU DIDN'T SAY IT WAS *THIS* ONE.\n\n**[ROSS backs away down the hall, still holding the box, and disappears down the stairs. GUNTHER watches him go, unbothered, and closes the door.]**\n\n**[The door shuts to reveal JOEY, flat against the wall behind it, holding a plate.]**\n\n**JOEY:** *(exhaling)* That was close.\n\n**GUNTHER:** *(passing him, back to the kitchen)* You've got sauce on your chin.\n\n**[COMMERCIAL BREAK]**\n\n---\n\n## ACT TWO\n\n### SCENE 5\n\n**[Scene: Apartment 19. Thursday, early evening. JOEY, ROSS and PHOEBE mid-crisis. The door bangs open \u2014 MONICA, carrying a covered casserole dish like the Ark of the Covenant. CHANDLER behind her with a diaper bag and a car seat in each hand.]**\n\n**MONICA:** *(entering)* WHERE IS HE.\n\n**JOEY:** *(pointing at Ross)* He told you?\n\n**MONICA:** Ross called me from a *pay phone*, Joey. He was *whispering.*\n\n**CHANDLER:** He called the house phone, the cell phone, and then, when he couldn't reach us, the *neighbors.*\n\n**ROSS:** Gail was very helpful.\n\n**MONICA:** *(rounding on him)* GUNTHER lives in my apartment?\n\n**ROSS:** Gunther lives in your apartment.\n\n**MONICA:** *Our* Gunther? Coffee Gunther? Yellow-hair, stares-at-Rachel Gunther?\n\n**ROSS:** He was wearing an apron and he had a *spoon*, Monica. He had a spoon and he was using it *correctly.*\n\n**[JOEY, who has known this for eight days, performs astonishment.]**\n\n**JOEY:** That's *crazy.* Who *does* that? *(beat)* Gunther. Wow.\n\n**[CHANDLER looks at him for exactly one second too long, then lets it go.]**\n\n**MONICA:** *(setting the dish down on the table)* Okay. Joey. Eat this.\n\n**JOEY:** What?\n\n**MONICA:** It's a chicken thing. You've got nobody feeding you.\n\n**JOEY:** Mon, I'm not really\u2014\n\n**MONICA:** *(quiet, dangerous)* Joseph.\n\n**[Beat. JOEY takes a fork and eats. He is full of lasagne. He chews with the grim discipline of a man defusing a bomb. MONICA watches every bite.]**\n\n**MONICA:** Good?\n\n**JOEY:** *(mouth full, eyes shining with pain)* ...Best thing I ate all week.\n\n**[MONICA glows. She actually glows. Then PHOEBE sets the clipboard down on the table, squarely, like a detective laying out a file.]**\n\n**PHOEBE:** Okay. Denise.\n\n**JOEY:** *(mouth full)* There's no Denise.\n\n**PHOEBE:** Exhibit one. Tuesday. You said no to a muffin.\n\n**MONICA:** *(head snapping up)* You said no to a *muffin?*\n\n**PHOEBE:** Exhibit two. Gunther is returning your personal property.\n\n**JOEY:** HE WORKS AT A COFFEE HOUSE.\n\n**MONICA:** Wait. Gunther lives eleven feet from this room.\n\n**PHOEBE:** *(waving it away)* Monica, that's a *coincidence.* Don't clutter the file.\n\n**[JOEY exhales.]**\n\n**PHOEBE:** *(turning a page)* Exhibit three. You've been showering.\n\n**ROSS:** He showers.\n\n**PHOEBE:** In the *evening*, Ross.\n\n**[Beat. The room considers this. It is, unfortunately, damning.]**\n\n**MONICA:** It's not a woman, he's *sick.* Look at him. He's grey.\n\n**JOEY:** I'm grey because I'm eating a *second dinner!*\n\n**ROSS:** Second to *what?*\n\n**[Silence. JOEY has walked directly into it. The whole room stares at him.]**\n\n**JOEY:** *(recovering, badly)* ...Lunch. Second to lunch. *(beat)* That's what dinner *is.*\n\n**PHOEBE:** *(writing, deeply satisfied)* He's protecting her.\n\n**[CHANDLER has not said anything. He is watching JOEY the way you watch a card trick you've already seen once.]**\n\n**CHANDLER:** *(to nobody)* Six days.\n\n**MONICA:** What?\n\n**CHANDLER:** I've been gone six days and there's already a Denise. *(sitting down heavily)* I'm on the 11:22, which puts me in bed at ten past one and on a platform again at six, and somewhere in the middle of that a man is going to tell me about my *lawn.*\n\n**PHOEBE:** You have a lawn?\n\n**CHANDLER:** I have a lawn, Phoebe, and I have *opinions* about it, and I have met three men who *also* have opinions about it, and their opinions are *different.*\n\n**PHOEBE:** *(a mark)* That's beautiful.\n\n**CHANDLER:** That's a demerit, isn't it.\n\n**PHOEBE:** It's a demerit.\n\n**[PHOEBE looks around the room, counting.]**\n\n**PHOEBE:** Where's Emma?\n\n**ROSS:** Asleep next to Jack. *(beat)* Which means Chandler has now labeled my daughter.\n\n**CHANDLER:** It says EMMA? on the inside of her shoe. *(beat)* With a question mark, because I'm not a *monster.*\n\n**[PHOEBE stands and consults the clipboard.]**\n\n**PHOEBE:** Okay. Seven o'clock. Everybody across the hall.\n\n**MONICA:** I'm not going in there.\n\n**PHOEBE:** Monica\u2014\n\n**MONICA:** I am *not* going in there. It's Thursday, I drove an hour, I love you all very much, and I am *not going in there.*\n\n**JOEY:** *(seizing it)* THERE. See? Monica's out. So it's off. Big shame. Everybody go home\u2014\n\n**PHOEBE:** *(not looking up)* Sit down, Joey.\n\n**JOEY:** *(sitting)* Yep.\n\n**ROSS:** Pheebs, the man *lives* there. We can't knock on a stranger's door and sit on his floor.\n\n**PHOEBE:** *(with total calm)* Ross. Last Thursday there were six of us in a room and it was the best two hours of my week. I'm not giving that up because a man with a spoon moved in. *(beat)* Somebody go ask him.\n\n**[Silence. Everyone looks at everyone.]**\n\n**PHOEBE:** Joey. He likes you.\n\n**JOEY:** *(instantly, far too loud)* WHY WOULD HE LIKE ME.\n\n**PHOEBE:** *(beat)* ...Because you're likeable?\n\n**JOEY:** *(standing)* ...Right. Yeah. Okay. I'll \u2014 this is gonna be really hard for me.\n\n**[He goes out. The door closes. Beat. The door opens.]**\n\n**JOEY:** He said yes.\n\n**PHOEBE:** You were gone four seconds.\n\n**JOEY:** He's very decisive.\n\n**[MONICA has not moved.]**\n\n**CHANDLER:** *(gently)* Honey. You don't have to go in.\n\n**MONICA:** *(standing up, jaw set, already walking)* Oh, I have to go in.\n\n---\n\n### SCENE 6\n\n**[Scene: Apartment 20. Thursday night. The door opens and the group files in \u2014 and stops. It is Monica's apartment. Every single thing. They stand there in a clump, six inches inside the door, like people at a wake.]**\n\n**CHANDLER:** *(after a long moment)* ...Okay, I'm just gonna say it. It's *nice* in here.\n\n**MONICA:** Chandler.\n\n**CHANDLER:** It's *warm.* There's *lamps.* We used to sit on the *floor* in here like a cult.\n\n**[ROSS has produced a tape measure from his jacket. Nobody questions it. He is measuring the distance from the couch to the wall.]**\n\n**ROSS:** Guys. *(reading it)* Guys. It's within an inch.\n\n**MONICA:** *(hollow)* Of what?\n\n**ROSS:** Of *right.*\n\n**[PHOEBE stands in the middle of the room with her eyes closed.]**\n\n**PHOEBE:** It's warm in here. *(opening her eyes)* You know what an empty apartment is? It's a *tooth socket.* This is a much better room with furniture in it, and I have felt insane for eight days for missing a *chair.*\n\n**MONICA:** *(pointing at the armchair, snapping)* And that's *wrong.* That chair was *here.*\n\n**[She drags the armchair away from the window.]**\n\n**JOEY:** *(without thinking)* No, he's right, it was by the window.\n\n**[Everyone turns and looks at him.]**\n\n**MONICA:** How would *you* know?\n\n**JOEY:** *(a fractional beat)* I lived across the hall for ten years, Monica!\n\n**RACHEL:** *(entering behind them, hearing this)* Joey, you didn't know my last name for two years.\n\n**JOEY:** I knew it! I just didn't *say* it!\n\n**[RACHEL is in the mustard vest. Everyone clocks ing in this room.\n\n**RACHEL:** What?\n\n**PHOEBE:** Nothing. Eat.\n\n**MONICA:** Where did you learn it?\n\n**GUNTHER:** From you.\n\n**MONICA:** *(stopping)* ...I never taught you anything.\n\n**GUNTHER:** Every February the heat went out in this building and you brought a pan of this down to the coffee house for whoever was working. *(handing her a plate)* Nine years. I reverse-engineered it.\n\n**[MONICA stands in her own kitchen holding a plate of her own lasagne made by a man she has said maybe four hundred words to. Her eyes fill. She fights it and wins, barely.]**\n\n**MONICA:** *(finally)* There's too much oregano.\n\n**GUNTHER:** *(evenly, serving)* There's exactly enough oregano.\n\n**[Long beat. The whole room watches MONICA GELLER concede something.]**\n\n**MONICA:** *(strangled)* ...There's exactly enough oregano.\n\n**[She takes a bite. Then, with the last of her dignity:]**\n\n**MONICA:** Your pan's wrong, though.\n\n**GUNTHER:** *(handing ROSS a plate)* Yeah, the pan's wrong.\n\n**[Everyone eats. It gets very quiet, because it is very good, and not one of them is going to say so.]**\n\n**RACHEL:** *(after a while, to her plate)* I moved four sweaters today.\n\n**MONICA:** *(still shell-shocked)* What?\n\n**RACHEL:** Sixty sweaters, on a wall, in a building nobody's ever heard of. I moved four. *(beat)* And the whole wall *works* now.\n\n**JOEY:** *(mouth full)* That's great, Rach.\n\n**RACHEL:** Nobody in that building knows who I am. *(beat)* And I'm the best one in it.\n\n**CHANDLER:** And you get a vest.\n\n**RACHEL:** *(with total sincerity)* I get a *vest.*\n\n**[ROSS has been quiet for a while, turning his fork over.]**\n\n**ROSS:** *(to Rachel, and he means it)* That's the whole job, though. Isn't it. Being the best one in the building.\n\n**RACHEL:** *(beat, seeing him)* ...Is that what's wrong with you?\n\n**ROSS:** He was nineteen.\n\n**RACHEL:** Who was?\n\n**ROSS:** Sloane. He read my ninety-six paper when he was *nineteen*, and then he  closes the clipboard.]**\n\n**PHOEBE:** ...So there's no Denise.\n\n**JOEY:** There's no Denise.\n\n**PHOEBE:** *(and this is a real loss)* I liked Denise.\n\n**JOEY:** *(beat)* ...Yeah. Me too.\n\n**[Beat.]**\n\n**PHOEBE:** She was a *florist.*\n\n**JOEY:** *(quietly devastated)* Was she?\n\n**[CHANDLER does not look at Joey. He looks at the kitchen. Then at the foil pan. Then, finally, at Joey \u2014 for about half a second.]**\n\n**MONICA:** *(unable to stop herself, to Treeger)* If you touch that door I will come back here from Westchester.\n\n**TREEGER:** *(at the door, unimpressed)* Lady, that's *your* commute.\n\n**[He goes. CHANDLER checks his watch and stands.]**\n\n**CHANDLER:** Okay. 11:22.\n\n**PHOEBE:** *(clipboard)* Attendance closes at ten.\n\n**CHANDLER:** Phoebe, I live in a *different county.*\n\n**PHOEBE:** *(making a mark, not unkindly)* And you came. *(beat)* That's a plus four.\n\n**[CHANDLER stops. Looks at her.]**\n\n**CHANDLER:** ...There are pluses?\n\n**PHOEBE:** There are now.\n\n**[They gather coats. MONICA is last. At the door, she stops. On the back of it, exactly where it was for ten years: the frame around the peephole. She touches it.]**\n\n**MONICA:** *(not turning around)* Gunther. Where'd you get the frame?\n\n**GUNTHER:** *(from the kitchen)* Flea market. Ninth Avenue. *(beat)* Took me a while.\n\n**MONICA:** *(beat)* ...Okay.\n\n**[She goes. CHANDLER, in the doorway, to the room:]**\n\n**CHANDLER:** She's gonna cry in the car.\n\n**MONICA:** *(O.S., from the hall)* I AM NOT GONNA CRY IN THE CAR.\n\n**CHANDLER:** *(going)* She's gonna cry in the car.\n\n---\n\n### SCENE 7\n\n**[Scene: The hallway. Coats on. The others are already down the stairs. JOEY holds the door of 20 half-open, waiting to go back in. CHANDLER has stopped on the landing.]**\n\n**CHANDLER:** You'd already eaten.\n\n**JOEY:** What?\n\n**CHANDLER:** Tonight. Before we got here. You had already eaten, and then you ate Monica's chicken anyway \u2014 which is either love or a *hostage situation.*\n\n**JOEY:** *(carefully)* ...I was hungry twice.\n\n**CHANDLER:** Nobody's hungry *twice*, Joey. You're hungry *continuously.* It's one of the four things I know about you.\n\n**[Beat.]**\n\n**CHANDLER:** You wanna tell me?\n\n**[JOEY looks at him. There is a long moment in which he could.]**\n\n**JOEY:** ...No.\n\n**CHANDLER:** *(nodding, taking it)* Okay.\n\n**[He starts down the stairs. Stops.]**\n\n**CHANDLER:** Hey. Six days ago I was a guy who knew everything about all of you by accident. *(beat)* Now I'm a guy who finds things out on a Thursday.\n\n**JOEY:** Chandler\u2014\n\n**CHANDLER:** No, it's \u2014 *(beat)* You lied to my face. In person. *(beat)* That's the most anybody's included me all week.\n\n**[He goes down the stairs. JOEY stands in the doorway holding that.]**\n\n---\n\n### SCENE 8\n\n**[Scene: Apartment 20. Later. Everyone gone. GUNTHER washing up. JOEY stacking plates on the counter, not leaving.]**\n\n**GUNTHER:** You ate my note.\n\n**JOEY:** I panicked.\n\n**GUNTHER:** It said three-fifty for forty minutes.\n\n**JOEY:** *(beat)* I got that part.\n\n**[He sets down the last plate. Doesn't go.]**\n\n**JOEY:** Hey. Thanks. For the \u2014 with Monica. The thing.\n\n**GUNTHER:** *(washing)* You looked like you were gonna pass out.\n\n**JOEY:** *(defensive)* I was *fine.* I was doing a *bit.*\n\n**[Beat.]**\n\n**JOEY:** I'm not gonna tell 'em.\n\n**GUNTHER:** I know.\n\n**JOEY:** It's not 'cause I'm ashamed.\n\n**GUNTHER:** *(beat)* It's a little bit 'cause you're ashamed.\n\n**JOEY:** *(beat)* It's a little bit 'cause I'm ashamed.\n\n**[GUNTHER dries his hands. Takes something out of his pocket and sets it on the counter. A key.]**\n\n**JOEY:** I got a key.\n\n**GUNTHER:** That one's Treeger's. *(beat)* That one's mine.\n\n**[JOEY looks at it. Does not pick it up.]**\n\n**JOEY:** *(carefully)* If I take that, what am I?\n\n**GUNTHER:** *(going back to the sink)* A guy with two keys.\n\n**[Beat. JOEY picks it up. Pockets it fast, like contraband.]**\n\n**JOEY:** Okay. Yeah. *(beat)* So \u2014 Sunday?\n\n**GUNTHER:** Sunday I do a roast.\n\n**JOEY:** *(already at the door, thrilled, betraying nothing)* Cool. Cool cool cool. That's \u2014 whatever. That's fine.\n\n**[He goes. Then the door opens again and his head comes back in.]**\n\n**JOEY:** What time's the roast?\n\n**[CLOSING CREDITS]**\n\n---\n\n## TAG\n\n**[Scene: The hallway. Very late. The door of Apartment 20 is beige. It looks like a door in a hotel. GUNTHER, in shirtsleeves, is painting it purple with a two-inch brush, working from the top down. JOEY comes out of 19 with a bag of chips.]**\n\n**JOEY:** What are you doing?\n\n**GUNTHER:** Treeger painted the door.\n\n**JOEY:** Yeah, I saw.\n\n**GUNTHER:** *(painting)* I'm painting it back.\n\n**[JOEY comes closer. Looks at the wet paint. Looks at the last unpainted corner of the old purple. Looks back.]**\n\n**JOEY:** ...That's the same purple.\n\n**GUNTHER:** Yeah.\n\n**JOEY:** No \u2014 Gunther. That's the *exact* same purple.\n\n**GUNTHER:** Yeah.\n\n**JOEY:** Did you take a chip of it, or \u2014 did you have a *chip?*\n\n**GUNTHER:** No.\n\n**JOEY:** Then how'd you get it exact?\n\n**[GUNTHER keeps painting.]**\n\n**GUNTHER:** Rachel's birthday. Ninety-nine. I stood in this hallway forty minutes holding everybody's coats.\n\n**[Beat.]**\n\n**JOEY:** ...You remembered a *color.* For five years.\n\n**GUNTHER:** I remember everything, Joey. *(beat)* It's not a gift.\n\n**[Beat. JOEY doesn't know where to put that.]**\n\n**JOEY:** ...Okay, that's the scariest thing anybody's ever said to me.\n\n**[GUNTHER holds out a second brush without looking at him. JOEY takes it and crouches at the bottom of the door. They paint.]**\n\n**JOEY:** Hey, Gunther?\n\n**GUNTHER:** Yeah.\n\n**JOEY:** How tall's the alley?\n\n**GUNTHER:** Six stories.\n\n**JOEY:** *(standing up)* ALLEYS DON'T HAVE STORIES!\n\n**GUNTHER:** *(calmly, still painting)* Do the bottom, Joey.\n\n**[JOEY does the bottom.]**\n\n**[BLACKOUT]**\n\n## END\n"
    }
  ];
  var EPKEY = "friends-s11-current-episode";

  /* ---------- render ---------- */
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    s = esc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*(\(.+?\))\*/g, '<em class="paren">$1</em>');
    s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
    return s;
  }

  /* Parses one episode's markdown into render blocks + a scene table of
     contents. Kept pure (no DOM writes) so it can run per-episode on switch. */
  function parse(md, sceneTitles) {
    var lines = md.split("\n");
    var html = [], toc = [], blockIdx = 0;
    var pendNum = null, pendIdx = null;
    var title = "", ep = "", note = "";

    function push(tag, cls, body) {
      html.push("<" + tag + ' class="' + cls + '" data-i="' + blockIdx + '">' + body + "</" + tag + ">");
      blockIdx++;
    }

    for (var i = 0; i < lines.length; i++) {
      var L = lines[i].trim();
      if (!L) continue;

      var head = L.match(/^(#{1,6})\s+(.+?)\s*#*$/);
      if (head) {
        var lvl = head[1].length, t = head[2];
        if (i < 6 && lvl <= 2) {
          if (t === "FRIENDS") continue;
          if (/^Season/i.test(t)) { ep = t; continue; }
          title = t.replace(/^"|"$/g, ""); continue;
        }
        if (lvl <= 2) {
          toc.push({ act: 1, label: t, i: blockIdx });
          push("h2", "act", esc(t));
        } else {
          /* "### SCENE 7" -- the script's own numbering, kept as the scene's label */
          var num = t.match(/(\d+)/);
          pendNum = num ? num[1] : null;
          pendIdx = blockIdx;
          push("p", "scenenum", esc(t.replace(/^SCENE\s+/i, "Scene ")));
        }
        continue;
      }
      if (L === "---") { html.push("<hr>"); continue; }
      if (L.indexOf("**[") === 0) {
        var body = L.replace(/^\*\*\[/, "").replace(/\]\*\*$/, "");
        var scene = body.match(/^Scene:\s*(.+?)[.\u2026]/);
        if (scene) {
          toc.push({ act: 0, num: pendNum, label: scene[1], i: pendIdx === null ? blockIdx : pendIdx });
          pendNum = null; pendIdx = null;
        }
        push("p", "stage", inline(body));
        continue;
      }

      var cue = L.match(/^\*\*([A-Z0-9 .'&/-]{2,28}):\*\*\s*(.*)$/);
      if (cue) {
        push("div", "line", '<span class="cue">' + esc(cue[1]) + "</span><p>" + inline(cue[2]) + "</p>");
        continue;
      }

      if (/^\*.*\*$/.test(L) && html.length < 12) { note = L.replace(/^\*|\*$/g, ""); continue; }
      if (/^(END OF|FADE|CUT TO|THE END)/i.test(L.replace(/\*/g, ""))) {
        push("p", "end", esc(L.replace(/\*/g, ""))); continue;
      }
      push("p", "plain", inline(L));
    }

    var sceneN = 0;
    toc.forEach(function (t) { if (!t.act) t.label = (sceneTitles && sceneTitles[sceneN++]) || t.label; });

    return { html: html, toc: toc, title: title, ep: ep, note: note };
  }

  /* ---------- shared reading state (rebuilt on episode switch) ---------- */
  var fill = document.getElementById("fill"), mk = document.getElementById("mk");
  var pct = document.getElementById("pct"), where = document.getElementById("where");
  var resume = document.getElementById("resume");
  var tocEl = document.getElementById("toc");

  var epIdx = 0, KEY = "", blocks = [], toc = [];
  var markIdx = 0, furthest = 0, openMark = 0, openOff = 0;

  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }

  function topBlock() {
    var y = 90, best = 0;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].getBoundingClientRect().top - y <= 0) best = i; else break;
    }
    return best;
  }
  function actFor(i) {
    var a = "";
    for (var k = 0; k < toc.length; k++) { if (toc[k].i <= i) { if (toc[k].act) a = toc[k].label; } else break; }
    return a;
  }

  function paint() {
    var i = topBlock();
    var p = blocks.length > 1 ? i / (blocks.length - 1) : 0;
    fill.style.width = (p * 100).toFixed(1) + "%";
    pct.textContent = Math.round(p * 100) + "%";
    where.textContent = actFor(i) || document.title;
    if (i > furthest) furthest = i;
    mk.style.left = (openMark / Math.max(1, blocks.length - 1) * 100) + "%";
    /* Only relevant while behind the mark (rereading an earlier scene) --
       once you've read past it, it's just a stale flag sitting behind you. */
    mk.style.opacity = (openMark > 0 && i < openMark) ? ".9" : "0";
    resume.dataset.show = (openMark > 0 && (openMark - i) > 8) ? "1" : "0";
  }

  var t = null, idle = null;
  function onScroll() {
    if (t) return;
    t = requestAnimationFrame(function () { t = null; paint(); });
    clearTimeout(idle);
    idle = setTimeout(commit, 400);
  }
  function commit() {
    var i = topBlock();
    markIdx = i;
    if (i > furthest) furthest = i;
    var el = blocks[i];
    var off = el ? el.getBoundingClientRect().top - 90 : 0;
    save({ i: i, off: off, max: furthest, at: Date.now() });
    paint();
  }

  function goto(i, off) {
    var el = blocks[Math.max(0, Math.min(blocks.length - 1, i))];
    if (!el) return;
    var y = window.pageYOffset + el.getBoundingClientRect().top - 90 - (off || 0);
    window.scrollTo({ top: Math.max(0, y), behavior: "auto" });
  }

  /* Episode picker sits above the scene list in the same sheet, so jumping
     to a scene and switching episodes share one "menu" entry point. */
  function renderToc() {
    tocEl.innerHTML = "";
    var epLabel = document.createElement("p");
    epLabel.className = "grouplabel";
    epLabel.textContent = "Episodes";
    tocEl.appendChild(epLabel);
    EPISODES.forEach(function (e, idx) {
      var b = document.createElement("button");
      b.dataset.ep = idx;
      b.setAttribute("aria-current", idx === epIdx ? "true" : "false");
      b.innerHTML = "<span>" + esc(e.num) + "</span><span>" + esc(e.title) + "</span>";
      tocEl.appendChild(b);
    });
    var sceneLabel = document.createElement("p");
    sceneLabel.className = "grouplabel";
    sceneLabel.textContent = "Scenes";
    tocEl.appendChild(sceneLabel);
    toc.forEach(function (tc) {
      var b = document.createElement("button");
      b.dataset.act = tc.act ? "1" : "0";
      b.dataset.i = tc.i;
      if (tc.act) b.textContent = tc.label;
      else {
        b.innerHTML = "<span>" + (tc.num || "\u00b7") + "</span><span>" +
          tc.label.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>";
      }
      tocEl.appendChild(b);
    });
  }

  function mountEpisode(idx, fresh) {
    epIdx = idx;
    var e = EPISODES[idx];
    var parsed = parse(e.md, e.sceneTitles);
    KEY = e.progressKey;

    doc.innerHTML =
      '<div class="titleblock">' +
        '<p class="show">Friends</p>' +
        (parsed.ep ? '<p class="ep">' + esc(parsed.ep) + "</p>" : "") +
        "<h1>" + esc(parsed.title || e.title) + "</h1>" +
        (parsed.note ? '<p class="note">' + esc(parsed.note) + "</p>" : "") +
      "</div>" + parsed.html.join("\n");

    document.title = "Friends: " + e.title;

    blocks = Array.prototype.slice.call(doc.querySelectorAll("[data-i]"));
    toc = parsed.toc;

    try { localStorage.setItem(EPKEY, e.id); } catch (err) {}

    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (err) {}

    markIdx = saved && typeof saved.i === "number" ? saved.i : 0;
    furthest = saved && typeof saved.max === "number" ? saved.max : markIdx;
    /* the spot you had when you opened this episode -- fixed for this visit, so
       wandering off to reread an earlier scene always has a way back. */
    openMark = fresh ? 0 : markIdx;
    openOff = fresh ? 0 : ((saved && saved.off) || 0);

    renderToc();

    if (!fresh && saved && saved.i > 0) {
      goto(saved.i, saved.off || 0);
      setTimeout(function () { goto(saved.i, saved.off || 0); paint(); }, 60);
    } else {
      window.scrollTo({ top: 0, behavior: "auto" });
    }
    paint();
  }

  /* ---------- display settings (shared across episodes) ---------- */
  var PKEY = "friends-s11-prefs";
  var root = document.documentElement;
  var prefs = {};
  try { prefs = JSON.parse(localStorage.getItem(PKEY) || localStorage.getItem("friends-s11e01-prefs") || "null") || {}; } catch (e) {}
  function savePrefs() { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch (e) {} }

  var THEMES = [
    ["auto", "Auto \u2014 follows your system"],
    ["paper", "Paper"], ["night", "Night"], ["sepia", "Sepia"],
    ["newsprint", "Newsprint"], ["perk", "Perk"], ["gaslight", "Gaslight"],
    ["moss", "Moss"], ["slate", "Slate"], ["rose", "Rose"], ["ivory", "Ivory"],
    ["pine", "Pine"], ["cobalt", "Cobalt"], ["ember", "Ember"]
  ];

  var swWrap = document.getElementById("swatches");
  var swName = document.getElementById("swname");
  THEMES.forEach(function (t) {
    var b = document.createElement("button");
    b.dataset.t = t[0];
    if (t[0] !== "auto") b.dataset.theme = t[0];   /* renders its own palette */
    b.type = "button";
    b.title = t[1];
    b.setAttribute("aria-label", t[1]);
    b.innerHTML = "<u></u><i></i>";
    swWrap.appendChild(b);
  });

  var themeMeta = document.querySelectorAll('meta[name="theme-color"]');
  function applyTheme(id, persist) {
    if (id === "auto") delete root.dataset.theme; else root.dataset.theme = id;
    swWrap.querySelectorAll("button").forEach(function (b) {
      var on = b.dataset.t === id;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) swName.textContent = b.title;
    });
    /* keep the browser chrome in step; read it back rather than duplicating hexes */
    var g = getComputedStyle(root).getPropertyValue("--ground").trim();
    if (g) themeMeta.forEach(function (m) { m.removeAttribute("media"); m.content = g; });
    if (persist) { prefs.theme = id; savePrefs(); }
  }

  var sizeWrap = document.getElementById("sizes");
  function applySize(s, persist) {
    var keep = persist ? topBlock() : null;
    root.dataset.size = s;
    sizeWrap.querySelectorAll("button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.s === s ? "true" : "false");
    });
    if (persist) { prefs.size = s; savePrefs(); goto(keep, 0); commit(); }
  }

  applyTheme(prefs.theme || "auto", false);
  applySize(prefs.size || "m", false);

  var prefsSheet = document.getElementById("prefs");
  var typeBtn = document.getElementById("type");
  typeBtn.addEventListener("click", function () {
    var open = prefsSheet.dataset.open !== "1";
    prefsSheet.dataset.open = open ? "1" : "0";
    typeBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  prefsSheet.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) {                                   /* backdrop */
      prefsSheet.dataset.open = "0";
      typeBtn.setAttribute("aria-expanded", "false");
      return;
    }
    if (b.dataset.s) applySize(b.dataset.s, true);
    else if (b.dataset.t) applyTheme(b.dataset.t, true);
  });

  var sheet = document.getElementById("sheet");
  document.getElementById("menu").addEventListener("click", function () {
    tocEl.querySelectorAll("button[data-i]").forEach(function (b) {
      b.dataset.read = (+b.dataset.i <= furthest) ? "1" : "0";
    });
    sheet.dataset.open = "1";
    prefsSheet.dataset.open = "0";
    typeBtn.setAttribute("aria-expanded", "false");
  });
  sheet.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { sheet.dataset.open = "0"; return; }
    if (b.dataset.ep !== undefined) {
      var newIdx = +b.dataset.ep;
      sheet.dataset.open = "0";
      if (newIdx !== epIdx) mountEpisode(newIdx, true);
      return;
    }
    sheet.dataset.open = "0";
    goto(+b.dataset.i, 0);
    commit();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    sheet.dataset.open = "0";
    prefsSheet.dataset.open = "0";
    typeBtn.setAttribute("aria-expanded", "false");
  });

  resume.addEventListener("click", function () {
    goto(openMark, openOff);
    commit();
  });

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", paint);
  document.addEventListener("visibilitychange", function () { if (document.hidden) commit(); });
  window.addEventListener("pagehide", commit);

  /* ---------- open where you left off ---------- */
  var startIdx = 0;
  try {
    var savedEp = localStorage.getItem(EPKEY);
    if (savedEp) {
      for (var k = 0; k < EPISODES.length; k++) { if (EPISODES[k].id === savedEp) { startIdx = k; break; } }
    }
  } catch (e) {}
  mountEpisode(startIdx, false);
})();
